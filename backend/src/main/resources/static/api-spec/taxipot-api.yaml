          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatisticsResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PotId:
      name: potId
      in: path
      required: true
      description: 택시팟 번호 (TAXIPOT.id)
      schema:
        type: integer
        format: int64
    UserId:
      name: userId
      in: path
      required: true
      description: 회원번호 (USERS.id)
      schema:
        type: integer
        format: int64
    VerificationId:
      name: verificationId
      in: path
      required: true
      description: 인증 번호 (STUDENT_VERIFICATION.id)
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20
    PaymentId:
      name: paymentId
      in: path
      required: true
      description: 결제 번호 (PAYMENT.id)
      schema:
        type: integer
        format: int64
  responses:
    NoContent:
      description: |
        성공 (본문 없음). Spring `ResponseEntity.noContent().build()`
        앱(Kotlin Retrofit)은 `suspend fun xxx(): Response<Unit>`으로 선언하고 `response.isSuccessful`로 성공 여부만 확인
    BadRequest:
      description: 요청 값 검증 실패 (INVALID_INPUT) / 날짜·시간에 +09:00 오프셋 누락 (INVALID_DATETIME_FORMAT)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidDatetimeFormat:
              $ref: '#/components/examples/InvalidDatetimeFormat'
    Unauthorized:
      description: 인증 토큰 없음·만료 (UNAUTHORIZED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 권한 없음·운영자 전용 (FORBIDDEN)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 대상 없음 (NOT_FOUND)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  examples:
    InsufficientBalance:
      summary: 잔액 부족
      value:
        code: INSUFFICIENT_BALANCE
        message: 지갑 잔액이 3,000원 부족합니다.
        detail:
          requiredAmount: 5500
          balance: 2500
          shortageAmount: 3000
        timestamp: '2026-10-16T23:10:00+09:00'
    SuspendedUser:
      summary: 이용 정지 중
      value:
        code: SUSPENDED_USER
        message: 이용 정지 중입니다. 2026-10-16 23:25 이후 다시 시도해 주세요.
        detail:
          suspendedUntil: '2026-10-16T23:25:00+09:00'
        timestamp: '2026-10-16T23:10:00+09:00'
    NotVerified:
      summary: 학생 인증 미완료
      value:
        code: NOT_VERIFIED
        message: 학생 인증이 완료되지 않았습니다.
        detail:
          emailStatus: VERIFIED
          reviewStatus: PENDING
        timestamp: '2026-10-16T23:10:00+09:00'
    ActivePotExists:
      summary: 진행 중인 다른 방 존재
      value:
        code: ACTIVE_POT_EXISTS
        message: 이미 참여 중인 택시팟이 있습니다.
        detail:
          activePotId: 31
        timestamp: '2026-10-16T23:10:00+09:00'
    GenderRestricted:
      summary: 성별 제한 방
      value:
        code: GENDER_RESTRICTED
        message: 여성만 참여할 수 있는 방입니다.
        detail:
          genderOption: FEMALE
        timestamp: '2026-10-16T23:10:00+09:00'
    PotFull:
