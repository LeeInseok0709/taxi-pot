          $ref: "#/components/responses/NoContent"

  # =========================
  # ADMIN API (운영자 웹)
  # =========================

  /api/admin/verifications:
    get:
      tags:
        - Admin
      summary: 학생 인증 심사 목록 조회
      description: reviewStatus 미지정 시 PENDING(심사 대기)만 반환. NOT_SUBMITTED(캡처 미제출)는 지정할 때만 조회 (3.3.0)
      parameters:
        - name: reviewStatus
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ReviewStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 성공 (캡처 이미지 URL 포함)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVerificationPageResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/verifications/{verificationId}:
    get:
      tags:
        - Admin
      summary: 학생 인증 상세 조회 (캡처본 열람)
      description: |
        가입 정보(이름·성별·대학교·학번)와 캡처 이미지 주소(captureImgUrl)를 함께 반환해 대조할 수 있게 한다.
        이미지 자체는 captureImgUrl(`/api/admin/verifications/{id}/capture`)을 운영자 토큰으로 요청해서 받는다
      parameters:
        - $ref: "#/components/parameters/VerificationId"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVerificationResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags:
        - Admin
      summary: 학생 인증 심사 (승인·반려)
      description: |
        - 심사 대상은 review_status = PENDING 행만. NOT_SUBMITTED면 409 CAPTURE_NOT_SUBMITTED, APPROVED·REJECTED면 409 ALREADY_REVIEWED (3.3.0)
        - APPROVED: 제출 학번이 USERS.student_no와 일치해야 함 → USERS.is_verified = 1
        - REJECTED: rejectReason 필수, 회원은 재제출 가능
        - 공통: reviewed_at = now, 결과를 SYSTEM 알림으로 발송
      parameters:
        - $ref: "#/components/parameters/VerificationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationReviewRequest"
      responses:
        "200":
          description: 심사 처리 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVerificationResponse"
        "400":
          description: REJECT_REASON_REQUIRED / STUDENT_NO_MISMATCH
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: ALREADY_REVIEWED / CAPTURE_NOT_SUBMITTED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/admin/verifications/{verificationId}/capture:
    get:
      tags:
        - Admin
      summary: 학생 인증 캡처 이미지 조회 (3.3.0)
      description: |
        서버 로컬 폴더에 저장된 캡처 이미지를 반환 (운영자 전용, 외부 공개 URL 없음). 캡처 미제출이거나 파일이 없으면 404.
        운영자 웹은 `fetch` + Authorization 헤더 → `blob()` → `URL.createObjectURL()`로 표시 (`<img src>` 직접 지정 시 401)
      parameters:
        - $ref: "#/components/parameters/VerificationId"
      responses:
        "200":
          description: 이미지
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/admin/users:
    get:
      tags:
        - Admin
      summary: 가입 회원 목록 조회
      parameters:
        - name: keyword
          in: query
          required: false
          description: 이름·닉네임·이메일·학번 검색
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/UserStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserPageResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/users/{userId}:
    get:
      tags:
        - Admin
      summary: 회원 상세 조회 (개인정보·지갑·캡처본·신고 이력 포함)
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetailResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/admin/users/{userId}/pots:
    get:
      tags:
        - Admin
      summary: 회원 이용 기록 조회
      description: 앱의 '내 택시 이용 기록'과 같은 응답 형식
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyPotHistoryPageResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/users/{userId}/status:
    patch:
      tags:
        - Admin
      summary: 회원 이용 정지·해제 (수동)
      description: |
        - SUSPENDED: suspendedUntil 미지정 시 영구 정지
          - 정지 규칙 통일 (3.3.0): 이미 정지 중이면 기존 정지와 새 정지 중 더 긴 쪽 유지 (영구 > 기간제). 짧게 바꾸려면 먼저 ACTIVE로 해제 후 다시 정지
        - ACTIVE: 정지 해제 (suspended_until = NULL). 영구 정지를 풀 수 있는 유일한 방법
        - WITHDRAWN 회원은 변경 불가
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStatusUpdateRequest"
      responses:
        "200":
          description: 변경 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserResponse"
        "403":
          description: FORBIDDEN / WITHDRAWN_USER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/admin/users/{userId}/wallet:
    patch:
      tags:
        - Admin
      summary: 지갑 잔액 조정 (시연 충전 수단, 3.7.0 확정)
      description: |
        시연 시 DB를 직접 수정하지 않고 운영자 화면에서 잔액을 조정하기 위한 API. 3.3.0부터 시연 충전은 이 API로만 한다 (앱 DUMMY 충전 폐지).
        POINT_HISTORY에 ADMIN_ADJUST(±금액, payment_id = NULL)로 기록해 실제 PG 충전(CHARGE)과 구분. 락 순서: 대상 회원 USERS → WALLET
        조정 후 balance가 0 미만이면 409(INSUFFICIENT_BALANCE), 잔액 상한 초과면 409(WALLET_LIMIT_EXCEEDED)
        - +금액 조정이면 직후 미수금 자동 납부(DEBT_PAY, 충전 승인과 같은 규칙, 3.5.0) — 시연에서 미수금 해제 시나리오에 사용
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletAdjustRequest"
      responses:
        "200":
          description: 조정 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: INSUFFICIENT_BALANCE / WALLET_LIMIT_EXCEEDED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/admin/reports:
