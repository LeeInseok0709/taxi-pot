      - bankCode
      - bankName
      - maskedAccountNumber
      - accountHolder
      properties:
        bankCode:
          type: string
          example: '004'
        bankName:
          type: string
          example: KB국민은행
        maskedAccountNumber:
          type: string
          description: 앞 3자리·뒤 4자리만 보이게 마스킹
          example: 123-****-9012
        accountHolder:
          type: string
          example: 홍길동
