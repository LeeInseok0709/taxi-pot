      - size
      - totalElements
      - totalPages
      properties:
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
          format: int64
          example: 57
        totalPages:
          type: integer
          example: 3
    AvailabilityResponse:
      type: object
      required:
      - available
      - reason
      properties:
        available:
          type: boolean
          example: true
        reason:
          type: string
          nullable: true
          enum:
          - DUPLICATE
          - RESERVED
          - null
          description: "사용 불가 사유 (사용 가능하면 null). RESERVED = '탈퇴회원_'으로 시작 → '이후 사용할 수 없는 닉네임입니다' (3.3.0)"
    UniversityResponse:
      type: object
      required:
      - id
      - name
      - emailDomain
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: SignupRequest.university에 그대로 보낼 학교명
          example: 한국대학교
        emailDomain:
          type: string
          description: "학교 이메일의 '@' 뒤 도메인"
          example: university.ac.kr
    Gender:
      type: string
      description: 'M: 남성 / F: 여성'
      enum:
      - M
      - F
    UserRole:
      type: string
      description: 'USER: 일반 학생 / ADMIN: 운영자'
      enum:
      - USER
      - ADMIN
    UserStatus:
      type: string
      description: 'ACTIVE: 정상 / SUSPENDED: 이용 정지 / WITHDRAWN: 탈퇴'
      enum:
      - ACTIVE
      - SUSPENDED
      - WITHDRAWN
    EmailStatus:
      type: string
      description: 'PENDING: 대기 / VERIFIED: 인증 완료'
      enum:
      - PENDING
      - VERIFIED
    ReviewStatus:
      type: string
      description: 'NOT_SUBMITTED: 캡처 미제출(3.3.0, 3.6.0 확정) / PENDING: 심사 대기 / APPROVED: 승인 / REJECTED: 반려'
      enum:
      - NOT_SUBMITTED
      - PENDING
      - APPROVED
      - REJECTED
    GenderOption:
      type: string
      description: 'ALL: 제한 없음 / MALE: 남성만 / FEMALE: 여성만'
      enum:
      - ALL
      - MALE
      - FEMALE
    PotStatus:
      type: string
      description: 'RECRUITING: 모집중 / CLOSED: 마감(매칭 확정) / RUNNING: 운행중 / COMPLETED: 종료(탑승·정산 완료) / CANCELED: 취소'
      enum:
      - RECRUITING
      - CLOSED
      - RUNNING
      - COMPLETED
      - CANCELED
    PotMemberRole:
      type: string
      description: 'HOST: 방장 / GUEST: 동승자'
      enum:
      - HOST
      - GUEST
    PreferredSeat:
      type: string
      description: 'FRONT: 조수석 / BACK_LEFT: 뒷좌석 왼쪽 / BACK_MID: 뒷좌석 가운데 / BACK_RIGHT: 뒷좌석 오른쪽 / NONE: 상관없음'
      enum:
      - FRONT
      - BACK_LEFT
      - BACK_MID
      - BACK_RIGHT
      - NONE
    PotMemberStatus:
      type: string
      description: 'JOINED: 참여중 / CANCELED: 참여 취소·입장 요청 철회·자동 취소 / BOARDED: 탑승 완료 / NO_SHOW: 노쇼(집결 기한 내 미도착 퇴장 — 자동·기한 후 방장 내보내기) / KICKED: 집결 기한 전 방장 내보내기 / REQUESTED: 참여 마감 후 입장 요청(방장 수락 대기, 3.3.0) / REJECTED: 입장 요청 거절(3.3.0)'
      enum:
      - JOINED
      - CANCELED
      - BOARDED
      - NO_SHOW
      - KICKED
      - REQUESTED
      - REJECTED
    PgProvider:
      type: string
      description: 'PORTONE: 포트원 / DUMMY: 6차까지의 시연용 더미 (3.3.0부터 신규 충전 불가, 과거 내역 조회용으로만 응답에 나타남)'
      enum:
      - PORTONE
      - DUMMY
    PaymentStatus:
      type: string
      description: 'PENDING: 결제 대기 / PAID: 결제 완료 / FAILED: 결제 실패 / REFUNDED: 환불(3.7.0 충전 환불 폐지, 과거 내역용)'
      enum:
      - PENDING
      - PAID
      - FAILED
      - REFUNDED
    PointType:
      type: string
      description: 'CHARGE: 충전(PORTONE 연동 시) / CHARGE_REFUND: 충전 환불(3.7.0 폐지, 과거 내역용) / ADMIN_ADJUST: 운영자 잔액 조정(시연 충전) / FARE_HOLD: 택시비·수수료 선결제 예치 / FARE_REFUND: 예치 해제·환불 / FARE_ADJUST: 실요금 초과분 추가 차감(3.2.0까지, 이후 기록 안 함) / FARE_PAY: 택시비 분담금 결제(3.3.0) / FEE: 서비스 수수료(정산 시점) / HOST_PAYOUT: 방장 정산금 입금(3.3.0) / DEBT_PAY: 미수금 납부(3.3.0) / BALANCE_EXPIRE: 탈퇴 잔액 소멸(3.3.0) / WITHDRAW: 등록 계좌로 출금(3.5.0) / WITHDRAW_REFUND: 송금 실패로 출금액 복구(3.5.0)'
      enum:
      - CHARGE
      - CHARGE_REFUND
      - ADMIN_ADJUST
      - FARE_HOLD
      - FARE_REFUND
      - FARE_ADJUST
      - FARE_PAY
      - FEE
      - HOST_PAYOUT
      - DEBT_PAY
      - BALANCE_EXPIRE
      - WITHDRAW
      - WITHDRAW_REFUND
    FareClaimStatus:
      type: string
      description: 'NONE: 청구 전 / PENDING: 운영자 확인 대기 / APPROVED: 승인(정산 완료) / REJECTED: 반려(재청구 가능) / OVERDUE: 탑승 시작 24시간 내 미청구 (3.5.0)'
      enum:
      - NONE
      - PENDING
      - APPROVED
      - REJECTED
      - OVERDUE
    WithdrawalStatus:
      type: string
      description: 'REQUESTED: 송금 처리 중 / COMPLETED: 송금 완료 / FAILED: 송금 실패(잔액 복구) (3.5.0)'
      enum:
      - REQUESTED
      - COMPLETED
      - FAILED
    SettlementStatus:
      type: string
      description: 'HELD: 예치중 / SETTLED: 정산 완료 / REFUNDED: 전액 환불(취소)'
      enum:
      - HELD
      - SETTLED
      - REFUNDED
    DebtStatus:
      type: string
      description: 'NONE: 미수 없음 / UNPAID: 미납(기한 내) / OVERDUE: 기한 경과(금액 변동 없음, 3.4.0) / PAID: 납부 완료 (3.3.0)'
      enum:
      - NONE
      - UNPAID
      - OVERDUE
      - PAID
    ReportType:
      type: string
      description: 'NO_SHOW: 노쇼 / ABUSIVE: 불쾌한 언행 / ETC: 기타'
      enum:
      - NO_SHOW
      - ABUSIVE
      - ETC
    ReportStatus:
      type: string
      description: 'PENDING: 접수 / APPROVED: 승인(패널티 적용) / REJECTED: 반려'
      enum:
      - PENDING
      - APPROVED
      - REJECTED
    MsgType:
      type: string
      description: 'TEXT: 일반 텍스트 / QUICK: 원터치 퀵블록'
      enum:
      - TEXT
      - QUICK
    NotificationType:
      type: string
      description: 'POT: 택시팟 참여·취소·마감·자동 해산·입장 요청·수락·거절 / PAYMENT: 충전·정산·미수금 안내·연체 / LATE_WARNING: 지각 경고 / KICKED: 퇴장·노쇼 처리 / RATING_REQUEST: 평가 요청 / REPORT_RESULT: 신고 처리 결과 / SYSTEM: 공지·시스템·인증 심사 결과'
      enum:
      - POT
      - PAYMENT
      - LATE_WARNING
      - KICKED
      - RATING_REQUEST
      - REPORT_RESULT
      - SYSTEM
    SignupRequest:
      type: object
      required:
      - email
      - password
      - name
      - nickname
      - phone
      - gender
      - university
      - studentNo
      - bankCode
      - accountNumber
      - accountHolder
      - agreeRequired
      properties:
        email:
          type: string
          format: email
          maxLength: 100
          example: hong@university.ac.kr
        password:
          type: string
          format: password
          minLength: 8
          example: Password123!
        name:
          type: string
          maxLength: 50
          example: 홍길동
        nickname:
          type: string
          maxLength: 30
          description: "'탈퇴회원_'으로 시작 불가 (RESERVED_NICKNAME)"
          example: 택시타는길동
        phone:
          type: string
          maxLength: 13
          pattern: '^01[016789]-?[0-9]{3,4}-?[0-9]{4}$'
          description: 하이픈 있어도 됨. 서버가 숫자만 남겨 암호화 저장
          example: 010-1234-5678
        gender:
          $ref: '#/components/schemas/Gender'
        university:
          type: string
          maxLength: 50
          description: GET /api/universities 응답의 name. 이메일 도메인이 이 학교 emailDomain과 일치해야 함
          example: 한국대학교
        studentNo:
          type: string
          maxLength: 20
          example: '20231234'
        bankCode:
          type: string
          maxLength: 10
          description: 출금 은행 코드 (`GET /api/banks`, 3.5.0)
          example: '004'
        accountNumber:
          type: string
          maxLength: 20
          description: 본인 명의 출금 계좌번호 (하이픈 허용, 서버가 숫자만 남겨 암호화 저장, 3.5.0)
          example: '123-456-789012'
        accountHolder:
          type: string
          maxLength: 50
          description: 예금주 (name과 같아야 함, 3.5.0)
          example: 홍길동
        agreeRequired:
          type: boolean
          description: 서비스 이용·개인정보·위치정보 필수 약관 일괄 동의 (true만 허용)
          example: true
        agreeMarketing:
          type: boolean
          default: false
          example: false
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          example: hong@university.ac.kr
        password:
          type: string
          format: password
          example: Password123!
        fcmToken:
          type: string
          description: 로그인 기기의 FCM 토큰 (선택)
    LoginResponse:
      type: object
      description: TokenResponse + 내 정보 (가입·로그인 공용)
      required:
      - accessToken
      - refreshToken
      - tokenType
      - expiresIn
      - user
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9...
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9...
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: 액세스 토큰 만료까지 남은 초
          example: 3600
        user:
          $ref: '#/components/schemas/MyProfileResponse'
    MyProfileResponse:
      type: object
      required:
      - id
      - email
      - name
      - nickname
      - phone
      - gender
      - university
      - studentNo
      - isVerified
      - ratingAvg
      - noShowCount
      - reportCount
      - cleanStreak
      - role
      - status
      - suspendedUntil
      - agreeMarketing
      - createdAt
      - updatedAt
      - nextSuspensionIn
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        name:
          type: string
        nickname:
          type: string
        phone:
          type: string
        gender:
          $ref: '#/components/schemas/Gender'
        university:
          type: string
        studentNo:
          type: string
        isVerified:
          type: boolean
        ratingAvg:
          type: number
          format: double
          example: 5.0
        noShowCount:
          type: integer
        reportCount:
          type: integer
          description: 승인된 신고 누적 (무신고 차감 반영 후). 3회 3일 / 6회 7일 / 10회 영구 정지
        cleanStreak:
          type: integer
          description: 신고 없이 탑승 완료한 연속 횟수 (3 도달 시 reportCount −1 후 0)
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        suspendedUntil:
          type: string
          format: date-time
          example: '2026-10-16T23:25:00+09:00'
          nullable: true
          description: SUSPENDED일 때만 값 존재, NULL이면 영구 정지(운영자만 해제). 정지 사유는 제공하지 않음
        agreeMarketing:
          type: boolean
        createdAt:
          type: string
          format: date-time
          example: '2026-10-16T23:25:00+09:00'
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-16T23:25:00+09:00'
        nextSuspensionIn:
          type: integer
          nullable: true
          description: 다음 정지까지 남은 신고 횟수 (화면 안내용, 영구 정지면 null)
          example: 1
    UserUpdateRequest:
      type: object
      description: 변경할 항목만 전달
      properties:
        nickname:
          type: string
          maxLength: 30
          description: "'탈퇴회원_'으로 시작 불가 (RESERVED_NICKNAME)"
        phone:
          type: string
          maxLength: 13
          pattern: '^01[016789]-?[0-9]{3,4}-?[0-9]{4}$'
        agreeMarketing:
          type: boolean
    PasswordChangeRequest:
      type: object
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8
    FcmTokenRequest:
      type: object
      required:
      - fcmToken
      properties:
        fcmToken:
          type: string
          maxLength: 255
    WithdrawRequest:
      type: object
      required:
      - password
      - agreeBalanceForfeit
      properties:
        password:
          type: string
          format: password
        agreeBalanceForfeit:
          type: boolean
          description: 남은 지갑 잔액 소멸 동의 (true만 허용, 3.3.0)
          example: true
    UserPublicResponse:
      type: object
      required:
      - id
      - nickname
      - university
      - ratingAvg
      - isWithdrawn
      properties:
        id:
          type: integer
          format: int64
        nickname:
          type: string
          example: 택시타는길동
        university:
          type: string
        ratingAvg:
          type: number
          format: double
          example: 6.4
        isWithdrawn:
          type: boolean
          description: 탈퇴 회원 여부 (탈퇴 14일 후 닉네임은 '탈퇴회원_{id}')
