    WithdrawalRequest:
      type: object
      description: 출금 신청 (3.5.0)
      required:
      - amount
      properties:
        amount:
          type: integer
          minimum: 1000
          maximum: 1000000
          description: 출금 금액 (1,000원 이상, 사용 가능 잔액 이하)
          example: 15000
    WithdrawalResponse:
      type: object
      description: 출금 1건 (3.5.0)
      required:
      - id
      - amount
      - bankName
      - maskedAccountNumber
      - accountHolder
      - transferProvider
      - transferTid
      - status
      - failReason
      - balanceAfter
      - requestedAt
      - completedAt
      properties:
        id:
          type: integer
          format: int64
        amount:
          type: integer
          example: 15000
        bankName:
          type: string
          nullable: true
          description: 탈퇴 14일 후 파기되면 null
          example: KB국민은행
        maskedAccountNumber:
          type: string
          nullable: true
          example: 123-****-9012
        accountHolder:
          type: string
          nullable: true
          example: 홍길동
        transferProvider:
          type: string
          description: 'DUMMY: 시연용 가상 송금'
          example: DUMMY
        transferTid:
          type: string
          nullable: true
          example: DUMMY-3f2b1c9e-7a51-4d2e-9b0a-1c2d3e4f5a6b
        status:
          $ref: '#/components/schemas/WithdrawalStatus'
        failReason:
          type: string
          nullable: true
        balanceAfter:
          type: integer
          nullable: true
          description: 처리 직후 지갑 사용 가능 잔액 (내역 조회에서는 null)
          example: 6167
        requestedAt:
          type: string
          format: date-time
          example: '2026-10-17T10:00:00+09:00'
        completedAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-17T10:00:01+09:00'
    WithdrawalPageResponse:
      type: object
      required:
      - content
      - page
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/WithdrawalResponse'
        page:
          $ref: '#/components/schemas/PageMeta'
    FareClaimReviewRequest:
      type: object
      description: 실요금 청구 승인·반려 (운영자, 3.5.0)
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - APPROVED
          - REJECTED
        rejectReason:
          type: string
          maxLength: 255
          nullable: true
          description: REJECTED면 필수
          example: 결제내역 사진의 금액(17,300원)과 청구 금액이 다릅니다.
    FareClaimResponse:
      type: object
      description: 실요금 청구 현황 (3.5.0)
      required:
      - potId
      - title
      - hostId
      - hostNickname
      - potStatus
      - fareClaimStatus
      - expectedFare
      - actualFare
      - fareRatio
      - boardedCount
      - receiptUrl
      - startedAt
      - claimDeadline
      - fareClaimedAt
      - fareReviewedAt
      - fareRejectReason
      properties:
        potId:
          type: integer
          format: int64
        title:
          type: string
        hostId:
          type: integer
          format: int64
        hostNickname:
          type: string
        potStatus:
          $ref: '#/components/schemas/PotStatus'
        fareClaimStatus:
          $ref: '#/components/schemas/FareClaimStatus'
        expectedFare:
          type: integer
          example: 18000
        actualFare:
          type: integer
          nullable: true
          description: 청구 금액 (청구 전 null)
          example: 19300
        fareRatio:
          type: number
          format: double
          nullable: true
          description: actualFare ÷ expectedFare (소수 둘째 자리, 청구 전 null) — 운영자 확인 참고용
          example: 1.07
        boardedCount:
          type: integer
          example: 3
        receiptUrl:
          type: string
          nullable: true
          description: 영수증 이미지 조회 API 경로 (운영자는 `/api/admin/pots/{potId}/receipt`)
        startedAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-16T23:31:00+09:00'
        claimDeadline:
          type: string
          format: date-time
          nullable: true
          description: 청구 기한 = startedAt + 24시간
          example: '2026-10-17T23:31:00+09:00'
        fareClaimedAt:
          type: string
          format: date-time
          nullable: true
        fareReviewedAt:
          type: string
          format: date-time
          nullable: true
        fareRejectReason:
          type: string
          nullable: true
    FareClaimPageResponse:
      type: object
      required:
      - content
      - page
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/FareClaimResponse'
        page:
          $ref: '#/components/schemas/PageMeta'
    ErrorResponse:
      type: object
      required:
      - code
      - message
      - detail
      - timestamp
      properties:
        code:
          type: string
          example: INSUFFICIENT_BALANCE
        message:
          type: string
          example: 지갑 잔액이 부족합니다.
        detail:
          type: object
          nullable: true
          additionalProperties: true
          description: 에러별 추가 정보. 코드별 필드는 info.description의 'ErrorResponse.detail 규격' 참고, 해당 없으면 null
          example:
            requiredAmount: 5500
            balance: 2500
            shortageAmount: 3000
        timestamp:
          type: string
          format: date-time
          example: '2026-10-16T23:25:00+09:00'
    PageMeta:
      type: object
      required:
