openapi: 3.0.3

info:
  title: 택시팟 API (통합본)
  version: 3.9.0
  description: |
    택시 동승 실시간 매칭 시스템(택시팟) API 명세서 — 기존 명세 3종(taxipot_api.yaml / taxipot-openapi_yaml.html / 택시팟_api명세서.txt)을
    DB 테이블 설계서(13차, 14개 테이블 — 16일 추가 회의 이후 확정 사항 반영) 기준으로 통합한 버전. 문서 간 충돌 시 DB 설계서 우선.

    ## 변경 이력
    - 3.9.0: 이메일 인증코드 유효 시간 5분 → 1분, 재발송 간격 60초 확정 (DB 설계서 13차와 1:1 대응, 스키마·코드값 변경 없음)
      - 인증코드 유효 시간: 발송 시각 + 1분 (서버 설정값 `app.verification.email-code-ttl-minutes=1`). 만료 후 입력은 400 EXPIRED_EMAIL_CODE → 재발송
      - `POST /api/verifications/email-code`: 직전 발송 후 60초 안에 다시 요청하면 메일을 보내지 않고 429 TOO_MANY_REQUESTS
      - 직전 발송 시각 = email_code_expires_at − 1분으로 계산 (컬럼 추가 없음). 서버 설정값 `app.verification.resend-interval-seconds=60`
      - 유효 시간(1분)과 재발송 간격(60초)이 같으므로, 코드가 만료되는 시점부터 재발송할 수 있다
      - 앱은 가입·재발송 성공 후 재발송 버튼을 60초 동안 비활성화하고 남은 시간을 표시
    - 3.8.0: 미수금 이용 제한의 예외 제거 확정 (DB 설계서 12차와 1:1 대응, 스키마·코드값 변경 없음)
      - 미수금이 생기면 이미 참여 중인 방의 진행 기능(도착 확인·채팅·탑승 시작 등)도 409 UNPAID_DEBT_EXISTS. 협의 필요 항목 모두 확정
    - 3.7.0: 남은 협의 항목 확정 (DB 설계서 11차와 1:1 대응)
      - 출발 확인 알림: 남은 참여자 전원 도착 3분 후에도 탑승 시작이 없으면 방장에게 알림 1회 (스케줄러 11번, TAXIPOT.start_reminded_at). 출발 30분 후 자동 취소는 유지
      - PORTONE 연동은 캡스톤 범위 외: 충전 API(`/api/payments`, `/confirm`)는 명세만 유지(구현 선택), 시연 충전은 운영자 잔액 조정
      - 1인 예치액 = floor(expected_fare × 1.2 ÷ max_members) + 1,000 (예상 분담금의 1.2배, 여유분은 정산 때 반환)
      - 출금 가능 범위: 사용 가능 잔액 전체 확정
      - 충전 환불 폐지: `POST /api/payments/{paymentId}/refund` 삭제, 지갑 잔액 반환은 출금으로 통일 (CHARGE_REFUND·REFUNDED 코드값은 과거 내역 조회용으로 유지)
    - 3.6.0: 협의 항목 3건 확정 (DB 설계서 10차와 1:1 대응, DB 스키마·코드값 변경 없음)
      - 캡처 미제출 표현: ReviewStatus.NOT_SUBMITTED 확정 (3.3.0 제안안 그대로)
      - 영수증 사진: 정산 승인 후 90일 보관 후 파기 (스케줄러 10번), 이후 영수증 조회는 404
      - 출금 송금: 시연은 더미 송금(DUMMY) 확정, 실제 송금 연동은 캡스톤 범위 외
    - 3.5.0: 미확정 항목·검토 빈틈에 대한 팀 결정 반영 (DB 설계서 9차와 1:1 대응)
      - 미수금 이용 제한: 미수금(UNPAID·OVERDUE)이 있으면 허용 목록 외 모든 API에서 409 UNPAID_DEBT_EXISTS (단, 이미 참여 중인 방의 진행 기능은 허용)
      - 미수금 자동 납부: 충전 승인·운영자 잔액 조정(+) 직후 미수금부터 자동 차감(DEBT_PAY)
      - 끝수는 택시팟 부담 확정 (방장에게 실요금 전액 지급, 변경 없음)
      - 출금 계좌: 가입 시 본인 명의 계좌 등록 필수(SignupRequest에 bankCode·accountNumber·accountHolder), `GET /api/banks`, `GET·PUT /api/users/me/account` 신규
      - 출금: `POST·GET /api/wallet/withdrawals` 신규 — 사용 가능 잔액 범위에서 등록 계좌로 송금, 시연은 더미 송금(DUMMY)으로 즉시 완료
      - 실요금 청구·운영자 확인: `POST /api/pots/{potId}/settlement`(즉시 정산) → `POST /api/pots/{potId}/fare-claim`(청구)로 변경,
        운영자 `GET /api/admin/fare-claims`·`PATCH /api/admin/pots/{potId}/fare-claim` 승인 시 정산 실행 / 반려 시 재청구
      - 청구 기한: 탑승 시작 후 24시간 내 미청구 시 OVERDUE + 운영자 알림 (스케줄러 9번), 청구 접수 이후 방은 '진행 중인 방'에서 제외
      - 탈퇴 시 결제 대기(PENDING) 충전은 포트원 조회 후 결제된 건은 PG 취소, 모두 FAILED
      - 정합성 수정: 스케줄러 1번(방장 미도착 자동 해산)에서도 남은 입장 요청(REQUESTED) → CANCELED
      - 코드값 추가: PointType.WITHDRAW·WITHDRAW_REFUND, FareClaimStatus·WithdrawalStatus(신규), 에러 코드 ACCOUNT_HOLDER_MISMATCH·ACCOUNT_NOT_REGISTERED·
        FARE_CLAIM_IN_REVIEW·FARE_CLAIM_NOT_PENDING·PAYMENT_CHECK_FAILED
      - 스키마 이름 변경: FareClaimRequest → FareClaimRequest
    - 3.4.0: 16일 회의 확정 사항 반영 (DB 설계서 8차와 1:1 대응, DB 스키마 변경 없음)
      - 미수금 납부 기한 7일 → 3일 (debt_due_at = settled_at + 3일)
      - 미수금 '10배'는 가입 약관 문구로만 명시(법적 조치 경고 포함). 서버는 금액을 늘리거나 추가로 차감하지 않음 — 기한 경과 시 OVERDUE 상태 표시만
      - 방 생성 최대 예약 기간 24시간 추가: 출발 시각이 현재 + 24시간을 넘으면 400 DEPARTURE_TIME_TOO_FAR (detail.maxDepartureTime)
      - 시연에서는 택시팟(운영자) 부담분(방장 대지급한 미수금·끝수)을 시연용 데이터로 처리
      - 확정(변경 없음): 수수료 1,000원은 정산 시 탑승자에게만, 방장 단독 방은 출발 시각에 패널티 없이 자동 해산, 입장 요청은 참여 마감(출발 5분 전)~탑승 시작 전,
        중간 취소자는 그 방 누구도 신고 불가, 인증코드 5회 = 입력 시도 횟수, 컬럼명 canceled_at 유지
      - 코드값 추가: 에러 코드 DEPARTURE_TIME_TOO_FAR
    - 3.3.0: 16일 추가 회의 반영 (DB 설계서 7차와 1:1 대응)
      - 계정·인증
        - '탈퇴회원_'으로 시작하는 닉네임 금지 (가입·닉네임 수정·중복 확인) → 400 RESERVED_NICKNAME
        - 토큰 버전(USERS.token_version): 탈퇴·비밀번호 변경 시 기존 토큰 전부 무효 → 401 TOKEN_REVOKED. 비밀번호 변경 응답 204 → 200(새 TokenResponse)
        - 가입 가능 학교 고정 목록 `GET /api/universities` 신규, 가입 시 학교·이메일 도메인 검증 (UNSUPPORTED_UNIVERSITY / EMAIL_DOMAIN_MISMATCH)
        - 이메일 인증코드 입력 5회 실패 시 해당 코드 무효 (EMAIL_CODE_ATTEMPTS_EXCEEDED), INVALID_EMAIL_CODE detail에 remainingAttempts
        - 캡처 미제출 상태 ReviewStatus.NOT_SUBMITTED 추가, 미제출 행은 심사 불가 (CAPTURE_NOT_SUBMITTED)
        - 캡처본은 서버 로컬 폴더 저장, 이미지는 운영자 인증 API `GET /api/admin/verifications/{id}/capture`로만 제공
        - 휴대폰번호는 서버에서 암호화 저장 (API 입출력은 평문 그대로)
      - 결제·정산
        - 앱 충전은 PORTONE만 허용 (DUMMY → 400 DUMMY_CHARGE_NOT_ALLOWED). 시연 충전은 운영자 잔액 조정(ADMIN_ADJUST)
        - 수수료(FEE)는 정산 시점에만 원장 기록, 참여 시에는 FARE_HOLD 1행(분담금 + 수수료). SettlementResponse.feeAmount nullable로 변경
        - 실요금 입력 API를 multipart(actualFare + receiptImage)로 변경, 결제내역 사진 필수. 영수증 조회 API 추가
        - 방장 정산금: 정산 때 방장 지갑에 실요금 전액 입금(HOST_PAYOUT), 탑승자 전원(방장 포함) 분담금(FARE_PAY)·수수료(FEE) 차감
        - 못 걷은 금액은 미수금으로 전환, 7일 안에 납부(`/api/wallet/debts`), 기한 경과 시 남은 금액 10배 (3.4.0에서 3일·금액 변동 없음으로 변경)
        - 노쇼·환불 행의 fareShare는 null (0 → null)
        - 탈퇴 시 남은 잔액 소멸(BALANCE_EXPIRE), 탈퇴 요청에 agreeBalanceForfeit 필수
      - 택시팟
        - 참여 마감 = 집결 기한(출발 5분 전). 이후 일반 참여는 409 JOIN_DEADLINE_PASSED, 입장 요청(`/join-requests`, 출발지 반경 50m) → 방장 수락으로 참여
        - 도착 인정 반경 100m → 50m
        - 방 생성은 출발 15분 전까지만 (DEPARTURE_TIME_TOO_SOON)
        - 출발 시각까지 방장만 남은 방·출발 30분 후 미출발 방 자동 취소 (스케줄러)
        - KICKED·NO_SHOW 처리 시각을 canceledAt에 기록, PotMemberStatus에 REQUESTED·REJECTED 추가
      - 신고·정지·평가
        - 신고 자격: 끝까지 탑승한 사람(BOARDED) 또는 노쇼를 당한 사람만 (REPORT_NOT_ELIGIBLE)
        - 모든 정지는 기존 정지와 비교해 더 긴 쪽 유지, 영구 정지는 운영자만 해제. SUSPENDED_USER detail에서 reason 삭제
        - 자동 기본 평가 구분 isDefault 추가, 자동 입력 이후 제출 불가 (RATING_PERIOD_EXPIRED)
      - 코드값 추가 (앱 enum 먼저 반영): ReviewStatus.NOT_SUBMITTED, PotMemberStatus.REQUESTED·REJECTED, PointType.FARE_PAY·HOST_PAYOUT·DEBT_PAY·BALANCE_EXPIRE, DebtStatus(신규)
    - 3.2.0: Kotlin(Android) 연동 오류 방지
      - 회원 탈퇴 `DELETE /api/users/me`(Body 포함) → `POST /api/users/me/withdraw`로 변경 (Retrofit `@DELETE`는 `@Body` 불가)
      - 본문 없는 성공 응답을 200 → 204 No Content로 통일 (앱은 `Response<Unit>`으로 수신)
      - 모든 Response 스키마에 `required` 지정 (required + nullable 아님 = 항상 값 있음 → Kotlin non-null 타입)
      - boolean 필드명 `is` 접두사 통일 (`MyPotHistoryResponse.rated` → `isRated`), Jackson의 `is` 제거 문제 방지 규칙 추가
      - 코드값(enum) 확장 정책 추가 (앱은 모르는 코드값을 UNKNOWN으로 처리)
    - 3.1.0: 리뷰 반영 — 백엔드 지침을 Java(Spring Boot) 기준으로 교체, 실시간 통신 STOMP로 변경, 회원 단위 동시 참여 방지(락 순서),
      ErrorResponse.detail 코드별 규격·예시 추가, 정산 미수 부족분(uncovered_amount) 기록, 충전 환불·운영자 조정 원장 유형 분리,
      노쇼 집계 규칙 확정, has_canceled 의미 확정, 이메일 인증 행 재제출 규칙 명확화, 금액 상한 지정
    - 3.0.0: 기존 명세 3종 통합

    ## 공통 규칙
    - 인증: 로그인·가입 시 받은 JWT를 `Authorization: Bearer {accessToken}` 헤더로 전달 (security: [] 표시된 API 제외)
      - 토큰 무효화 (토큰 버전): 액세스·리프레시 토큰 claim `tv`에 발급 시점의 USERS.token_version을 넣는다
        - 서버 인증 필터는 매 요청마다 `SELECT token_version, status FROM USERS WHERE id = ?`로 비교, 다르면 401 TOKEN_REVOKED (재발급 API도 동일)
        - token_version + 1 시점: 회원 탈퇴, 비밀번호 변경 → 그 전에 발급된 모든 기기의 토큰이 즉시 무효
        - 앱은 401 TOKEN_REVOKED를 받으면 재발급을 시도하지 말고 저장된 토큰을 지우고 로그인 화면으로 이동
      - 미수금 이용 제한 (3.5.0): SETTLEMENT.debt_status가 UNPAID·OVERDUE인 행이 있는 회원은 아래 허용 목록 외 모든 API에서 409 UNPAID_DEBT_EXISTS
        - 인증 필터 다음 인터셉터에서 일괄 검사 (각 API에서 따로 검사하지 않음). 운영자 API(`/api/admin/**`)는 대상 아님
        - 허용 목록: 로그인·토큰 재발급·로그아웃, `PUT /api/users/me/fcm-token`, `GET /api/users/me`, `GET /api/wallet`, `GET /api/wallet/history`,
          `GET /api/wallet/debts`, `POST /api/wallet/debts/{settlementId}/pay`, `POST /api/payments`, `POST /api/payments/confirm`, `GET /api/payments`,
          `/api/notifications/**`, `GET /api/universities`, `GET /api/banks`
        - 예외 없음 (3.8.0 확정): 미수금이 생기기 전부터 참여 중이던 방의 진행 기능(상세 조회·도착 확인·좌석 변경·참여 취소·채팅·STOMP 구독,
          방장의 탑승 시작·내보내기·입장 요청 처리·실요금 청구)도 차단
          - 그 방에는 일반 규칙이 그대로 적용: 집결 기한까지 도착 확인이 없으면 노쇼 처리(15분 정지), 방장이면 방장 미도착 해산 또는 출발 30분 후 자동 취소
          - 운영자 잔액 조정으로 미수금이 0이 되면 즉시 해제되어 다시 진행 가능
        - 충전·운영자 조정 입금 시 미수금이 자동 납부되어 0이 되면 즉시 해제
        - 앱은 UNPAID_DEBT_EXISTS를 받으면 미수금 화면(충전·납부)으로 이동
    - 운영자 API(`/api/admin/**`)는 USERS.role = ADMIN만 호출 가능 (운영자 계정 1개, 동시 접속 허용)
    - 본인 식별은 토큰으로 처리하고 경로에는 `me` 사용
    - 요청·응답은 `application/json` (캡처본 제출·실요금 청구만 `multipart/form-data`), 필드명은 camelCase (DB snake_case → camelCase)
      - 이미지 조회 API(캡처본·영수증)는 JSON이 아니라 이미지 바이너리(`image/jpeg`·`image/png`)를 반환하고, 일반 API처럼 Bearer 토큰이 필요하다
        - 운영자 웹: `<img src>`는 Authorization 헤더를 못 보내므로 `fetch(url, {headers})` → `blob()` → `URL.createObjectURL()`로 표시
        - 앱(Kotlin): Retrofit `ResponseBody` 또는 Glide `GlideUrl(url, LazyHeaders.Builder().addHeader("Authorization", ...))`
      - 업로드 파일: jpg·png만, 1개 10MB 이하 (Spring `spring.servlet.multipart.max-file-size=10MB`, `max-request-size=12MB`)
      - 파일은 서버 로컬 폴더(설정값 `app.upload-dir`, 외부 정적 공개 경로 아님)에 UUID 파일명으로 저장하고 DB에는 상대 경로만 저장
        - 파일 저장 후 DB 트랜잭션이 롤백되면 저장한 파일을 지운다 (`TransactionSynchronization.afterCompletion`)
    - 코드값(enum)은 DB '코드 정의' 시트와 동일
    - 성공 응답
      - 돌려줄 데이터가 있으면 HTTP 200 + 데이터를 감싸지 않고 바로 반환
      - 돌려줄 데이터가 없으면 HTTP 204 No Content (본문 없음). Spring `ResponseEntity.noContent().build()`
      - 앱(Kotlin Retrofit)은 204 API를 `suspend fun xxx(): Response<Unit>`으로 선언 (데이터 클래스로 받으면 파싱 오류)
    - 실패는 공통 `ErrorResponse`
    - HTTP 메서드: DELETE 요청에는 Body를 넣지 않는다 (Retrofit `@DELETE`는 `@Body` 불가). Body가 필요한 삭제성 동작은 POST 하위 경로로 설계
    - 목록 API는 페이지 응답(`content` + `page`) 사용. `page`는 0부터, `size` 기본 20
      - 채팅만 커서 방식(`cursor` + `nextCursor`)
    - 금액: 원(KRW) 정수. ID: BIGINT(int64)
    - 성별 매핑: USERS.gender `M` ↔ TAXIPOT.gender_option `MALE`, `F` ↔ `FEMALE`
    - 개인정보: 휴대폰번호는 DB에 AES-256-GCM 암호문으로 저장 (JPA `AttributeConverter`, 키는 서버 환경변수). API 입출력은 평문 그대로이며 앱 변경 없음
      - 저장 전 숫자만 남겨 정규화(`010-1234-5678` → `01012345678`), 응답도 정규화된 값

    ## 일시(KST) 규칙
    - 모든 일시는 대한민국 표준시(KST, UTC+09:00). Request·Response 모두 ISO-8601 + `+09:00` 오프셋 포함 (예: `2026-10-16T23:30:00+09:00`)
    - `Z`(UTC) 표기·오프셋 없는 값은 사용하지 않음. 오프셋 없는 Request 값은 400(INVALID_DATETIME_FORMAT)
    - DB(MySQL DATETIME)에는 KST 값 그대로 저장 (MySQL `time_zone = '+09:00'`)
    - 백엔드(Java, Spring Boot)
      - JVM `-Duser.timezone=Asia/Seoul`, JDBC URL `serverTimezone=Asia/Seoul`, JPA `spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul`
      - DTO의 일시 필드는 `OffsetDateTime` 사용 (`LocalDateTime`은 오프셋이 빠져 응답에 `+09:00`이 붙지 않으므로 DTO에 쓰지 않음)
      - Jackson: `spring.jackson.serialization.write-dates-as-timestamps=false`, `spring.jackson.time-zone=Asia/Seoul`
      - Entity는 `LocalDateTime`(KST)으로 두고 DTO 변환 시 `atOffset(ZoneOffset.ofHours(9))`
    - 앱(Kotlin)
      - Request 생성: `OffsetDateTime.now(ZoneId.of("Asia/Seoul"))` 또는 `LocalDateTime.atOffset(ZoneOffset.ofHours(9))` → `DateTimeFormatter.ISO_OFFSET_DATE_TIME`으로 문자열화
      - `Instant`·`Date`·`toString()` 기본 직렬화는 `Z`(UTC)가 붙을 수 있으므로 금지. Gson/Moshi에 OffsetDateTime 어댑터를 등록해 한 곳에서 처리
      - 응답 파싱은 `OffsetDateTime.parse()`, 화면 표시는 `ZoneId.of("Asia/Seoul")`
      - 올바른 예: `2026-10-16T23:30:00+09:00` / 잘못된 예: `2026-10-16T14:30:00Z`, `2026-10-16T23:30:00`
    - 서버 내부 시각 비교(출발 10분 전, 집결 기한, 정지 만료, 탈퇴 14일 등)도 모두 KST

    ## 응답 타입 변환 (Kotlin 파싱 오류 방지)
    - `TINYINT(1)` 컬럼(is_verified, is_read, has_canceled, agree_marketing)은 0/1이 아닌 `true`/`false`
    - `TINYINT(1)`은 MySQL Connector/J가 기본으로 `Boolean`에 매핑 (Entity 필드 `Boolean`)
    - `DECIMAL` 컬럼(rating_avg, avg_score)은 Entity `BigDecimal` → DTO `Double`로 변환해 숫자로 응답 (문자열 금지)
    - 타입 대응: id `BIGINT` ↔ Java `Long` ↔ Kotlin `Long` / 금액 `INT` ↔ Java `Integer` ↔ Kotlin `Int`. Request도 같은 타입 규칙
    - 금액 범위: INT 최대 2,147,483,647원. 아래 상한으로 이 범위를 넘지 않음을 보장하므로 BIGINT/Long 전환은 하지 않음
      - 1회 충전 1,000 ~ 500,000원, 지갑 잔액(balance + held_balance) 최대 1,000,000원, 예상·실제 택시 요금 최대 500,000원
      - 상한 초과 요청은 400(INVALID_INPUT), 충전 후 잔액 상한 초과는 409(WALLET_LIMIT_EXCEEDED)

    ## 필수 필드·null 규칙 (Response)
    - 모든 Response 스키마는 `required`로 항상 내려오는 필드를 표시한다
      - required이고 nullable이 아닌 필드: 항상 값이 있음 → Kotlin non-null 타입 (예: `val nickname: String`)
      - required이면서 `nullable: true`인 필드: 키는 항상 있고 값이 null일 수 있음 → Kotlin nullable 타입 (예: `val arrivedAt: OffsetDateTime?`)
    - 백엔드는 null 값도 키를 생략하지 않고 `null`로 내려준다 (Jackson 기본 동작 유지, `spring.jackson.default-property-inclusion=non_null` 설정 금지)
    - openapi-generator로 Kotlin 코드를 생성하면 required 기준으로 non-null / nullable이 자동 결정됨

    ## boolean 필드명 규칙 (Jackson `is` 제거 문제)
    - JSON boolean 필드명은 `is` + 형용사(isVerified, isRead, isJoined, isRated, isWithdrawn) 또는 `has` + 명사(hasCanceled)로 통일
    - 주의: Java DTO에 `boolean isRated` + Lombok `@Getter`를 쓰면 getter가 `isRated()`가 되고, Jackson이 `is`를 떼어 JSON에 `"rated"`로 내보낸다
      → 앱의 `isRated` 필드가 항상 기본값(false)으로 들어오는 오류 발생
    - 해결(둘 중 하나로 통일)
      - DTO를 Java `record`로 작성 (record는 컴포넌트 이름 그대로 `"isRated"`로 직렬화)
      - 또는 필드에 `@JsonProperty("isRated")` 지정
    - Kotlin 앱은 `val isRated: Boolean` 그대로 사용

    ## 코드값(enum) 확장 정책
    - 서버는 코드값을 추가할 수 있다 (예: 3.1.0에서 PointType에 CHARGE_REFUND·ADMIN_ADJUST 추가). 기존 코드값의 이름 변경·삭제는 하지 않는다
    - 코드값 추가 시 명세 변경 이력에 기록하고, 앱이 먼저 대응한 뒤 서버에 반영한다
    - 앱은 모르는 코드값을 받아도 죽지 않도록 모든 enum에 `UNKNOWN` 항목을 두고 대체한다
      - Moshi: `EnumJsonAdapter.create(Xxx::class.java).withUnknownFallback(Xxx.UNKNOWN)`
      - kotlinx.serialization: `Json { coerceInputValues = true }` + 필드 기본값 `= Xxx.UNKNOWN`
      - Gson: 모르는 값은 null로 들어오므로 enum 필드를 nullable로 받고 null을 UNKNOWN으로 처리
    - 화면에서는 UNKNOWN을 '기타'로 표시하고, 앱이 Request로 UNKNOWN을 보내지 않는다

    ## 핵심 정책 (DB 설계서 기준)
    - 인증: 대학교 이메일 인증 + 학생 기본 정보 캡처본 심사. USERS.is_verified = 1이어야 방 생성·참여 가능
      - 이메일 인증코드: 유효 1분, 같은 코드 입력 실패 5회까지, 재발송 간격 60초 (3.9.0)
    - 이용 조건 검증 순서(방 생성·참여·입장 요청 공통): 학생 인증 → 이용 정지 → 미수금 → 성별 제한 → 진행 중인 다른 방 → 모집 인원 → 지갑 잔액
      - '진행 중인 다른 방' = 내 참여 상태가 JOINED·BOARDED·REQUESTED이고, 방 상태가 RECRUITING·CLOSED이거나 RUNNING이면서 실요금 청구 전(fare_claim_status = NONE)인 방
        (3.5.0: 청구 접수(PENDING·REJECTED) 이후·OVERDUE 방은 제외 → 운영자 확인을 기다리는 동안에도 새 방 이용 가능, 예치금은 정산까지 묶임)
      - 미수금: SETTLEMENT.debt_status가 UNPAID·OVERDUE인 행이 있으면 409 UNPAID_DEBT_EXISTS (3.5.0 확정: 공통 규칙 '미수금 이용 제한'으로 허용 목록 외 전 기능 차단)
    - 1인 예치액 = floor(expected_fare × 1.2 ÷ max_members) + 수수료 1,000원 (3.7.0). 잔액 부족 시 방 생성·입장 불가
      - 1.2 = 예상 분담금 여유분(서버 설정값 `app.pot.hold-buffer-rate=1.2`). 실요금이 예상보다 많이 나와도 미수금이 덜 생기게 하기 위함, 수수료에는 적용 안 함
      - 정수 계산: floor(expected_fare × 12 ÷ (max_members × 10)). 예: 예상 20,000원·4인 방 → 6,000 + 1,000 = 7,000원
      - 정산 때 예치액 전액을 풀고 실제 부담액만 걷으므로 쓰이지 않은 여유분은 그대로 반환. 3.7.0 이전에 예치된 HELD 행은 기존 금액 그대로
    - 정산: 1인 분담금 = floor(actual_fare ÷ 탑승 인원), 1원 단위 끝수는 운영자(앱) 부담 (3.5.0 확정)
      - 정산은 방장의 실요금 청구를 운영자가 승인할 때 실행 (3.5.0, 아래 '실요금 청구·운영자 확인')
    - 출발 10분 전부터 참여 취소·방 취소 불가
    - 방 생성 가능 시간 (3.4.0 확정): 출발 시각이 현재 + 15분 이후 ~ 현재 + 24시간 이내
      (서버 설정값 `app.pot.min-lead-minutes=15`, `app.pot.max-advance-hours=24`)
      - 15분 미만이면 400 DEPARTURE_TIME_TOO_SOON, 24시간 초과면 400 DEPARTURE_TIME_TOO_FAR
      - 15분 미만이면 생성 직후 취소 마감(출발 10분 전)·참여 마감(출발 5분 전)이 바로 와서 방장이 즉시 노쇼 처리될 수 있음
    - 참여 마감 = 집결 기한(출발 5분 전) (3.3.0, 3.4.0 확정)
      - 마감 전: 일반 참여(`POST /members`)
      - 마감 후: 방은 목록에서 숨기지 않음. 일반 참여는 409 JOIN_DEADLINE_PASSED, 대신 입장 요청(`POST /join-requests`, 출발지 반경 50m 안) → 방장 수락
      - 수락 시 arrived_at = 수락 시각으로 기록 → 들어오자마자 노쇼 처리되는 일 없음
      - 입장 요청은 참여 마감(출발 5분 전)부터 탑승 시작 전까지, 방 상태 RECRUITING(빈자리 있음)일 때만 가능 (3.4.0 확정)
    - has_canceled(취소 발생 여부)의 의미: '참여자 이탈로 빈자리가 생긴 적이 있는 방' 표시
      - 1로 바꾸는 경우: 동승자 참여 취소, 방장 내보내기(KICKED), 미도착 퇴장(NO_SHOW)
      - 방 전체 취소는 has_canceled가 아니라 status = CANCELED로만 표현 (has_canceled 변경 없음)
      - 목록 상단 노출·색상 구분은 status = RECRUITING이면서 has_canceled = 1인 방에만 적용 (CLOSED·CANCELED 등은 목록 기본 조회 대상 아님)
      - 한 번 1이 되면 다시 0으로 되돌리지 않음
    - 집결 기한(arrival_deadline) = 출발 5분 전, 서버가 자동 설정. GPS 지정 위치 반경 50m(서버 설정값 `app.arrival.radius-meters=50`) 안에서만 도착 확인
    - 출발(탑승 시작) 조건: 방장 포함 남은 참여자(JOINED) 전원이 도착 확인 + 2명 이상. 한 명이라도 미도착이면 출발 불가
    - 방치된 방 자동 정리 (3.3.0): 출발 시각까지 방장만 남아 있으면 출발 시각에 패널티 없이 자동 해산·환불(3.4.0 확정), 출발 30분 후에도 탑승 시작이 없으면 자동 취소·전원 환불(3.7.0 확정)
      - 출발 확인 알림 (3.7.0): 남은 참여자 전원이 도착 확인하고 3분이 지나도 탑승 시작이 없으면 방장에게 '출발했다면 버튼을 눌러주세요' 알림 1회 (스케줄러 11번)
        — 택시를 탔는데 방장이 버튼을 잊어 30분 후 자동 취소·전원 환불되는 일을 막기 위함
    - 미도착: 집결 기한까지 도착 확인이 없으면 퇴장 + 예치금 전액 환불 + 15분 이용 정지 (금전 페널티 없음)
    - 노쇼 집계 규칙 (중복 집계 방지)
      - 노쇼 = 집결 기한까지 도착 확인 없이 퇴장 처리된 경우 (스케줄러 자동 퇴장, 또는 집결 기한 이후 방장 내보내기)
        → TAXIPOT_MEMBER.status = NO_SHOW, canceled_at = 처리 시각, USERS.no_show_count + 1, 15분 정지. 노쇼 집계는 이 시점에서만 1회 발생
      - 집결 기한 전 방장 내보내기 → status = KICKED, canceled_at = 처리 시각 (노쇼 아님, 정지·집계 없음)
      - 노쇼·환불 행의 SETTLEMENT.fare_share·fee_amount·diff_amount는 NULL (응답 fareShare = null)
      - NO_SHOW 유형 신고가 승인돼도 no_show_count와 참여 상태는 바꾸지 않고 report_count만 반영 (같은 사건 이중 집계 방지)
    - 평점: 10점 만점, 초기 5.00. 평가 1건의 4항목 평균 ★4 이상 +0.2 / ★3 이상 유지 / ★3 미만 −0.2 (1.00~10.00 범위 유지)
    - 신고: 운영자 승인 시 누적. 3회 3일 정지 / 6회 7일 정지 / 10회 영구 정지. 신고 없이 3회 탑승 완료 시 누적 1회 차감
      - 신고 자격 (3.3.0): ① 신고자·피신고자 모두 그 방 BOARDED(끝까지 탑승), 또는 ② 피신고자가 그 방 NO_SHOW이고 신고자가 끝까지 남은 참여자(JOINED·BOARDED) — ②는 type = NO_SHOW만
      - 중간에 취소(CANCELED)하거나 내보내진(KICKED)·노쇼(NO_SHOW)·입장 요청(REQUESTED·REJECTED) 상태인 사람은 그 방의 누구도 신고 불가(신고 유형 무관) → 403 REPORT_NOT_ELIGIBLE (3.4.0 확정)
    - 정지 규칙 통일 (3.3.0): 미도착 15분·신고 누적·운영자 수동 정지 모두 '기존 정지와 새 정지 중 더 긴 쪽'을 남긴다
      - 비교: 영구(suspended_until = NULL) > 기간제, 기간제끼리는 더 늦은 시각. 이미 영구 정지면 그대로 유지
      - 영구 정지는 운영자 해제(`PATCH /api/admin/users/{userId}/status` ACTIVE)로만 풀림. 신고 차감(clean_streak)으로 report_count가 줄어도 정지는 그대로
      - 정지 사유는 저장·노출하지 않는다 (SUSPENDED_USER detail에 reason 없음)
    - 정지 중에도 로그인·조회·채팅 가능, 방 생성·참여만 차단
    - 탈퇴: 논리 삭제, 14일 후 개인정보 파기, 같은 학번 재가입 가능. 남은 지갑 잔액은 소멸(약관 명시), token_version + 1
    - 닉네임: '탈퇴회원_'으로 시작하는 닉네임은 탈퇴 회원 표시용으로 예약 → 가입·수정 불가, 안내 문구 '이후 사용할 수 없는 닉네임입니다' (DB CHECK로도 막힘)
    - 가입 가능 학교: UNIVERSITY 고정 목록(is_active = 1)만. 이메일을 소문자로 바꾼 뒤 '@' 뒤 도메인이 학교 email_domain과 정확히 일치해야 함

    ## 포인트 원장(POINT_HISTORY) 기록 규칙
    - amount는 '사용 가능 잔액(balance)'의 증감, balance_after는 거래 직후 balance
    - 참여(방 생성·입장 요청 수락 포함): FARE_HOLD(−예치액) 1행. 예치액 = floor(expected_fare × 1.2 ÷ max_members) + 수수료 1,000 (3.7.0), balance → held_balance 이동
      - 수수료는 이 시점에 기록하지 않는다 (3.3.0: 수수료 기록 시점 = 정산, 3.4.0 확정 — 1,000원은 정산 때 탑승자에게만 걷음). SETTLEMENT.fee_amount도 정산 전에는 NULL
    - 취소·퇴장·노쇼·방 취소: FARE_REFUND(+예치액 전액), held_balance 해제. FEE 기록 없음
    - 정산 (운영자가 실요금 청구를 승인할 때 실행, 방 단위, 하나의 트랜잭션, 아래 순서 고정 — 3.5.0)
      1. 방장: HOST_PAYOUT(+actual_fare) — 방장이 택시비를 냈으므로 실요금 전액을 포인트로 입금 (못 걷은 금액·끝수 포함 택시팟이 전액 지급)
      2. 탑승자(BOARDED, 방장 포함) 각자: FARE_REFUND(+held_amount, 예치 해제) → FARE_PAY(−분담금) → FEE(−1,000)
         - 해제 후 balance가 분담금 + 수수료보다 적으면 0원까지만 차감(분담금 먼저, 그다음 수수료)하고, 못 걷은 금액 = uncovered_amount → 미수금(debt_amount)
         - 차감액이 0인 행은 기록하지 않음
      - 방장 순수 입금액 = actual_fare − 방장 분담금 − 1,000 = 동승자 분담금 합계 + 끝수 − 1,000 (16일 회의 '동승자 분담금 합계를 방장 지갑에'와 같은 결과)
      - 대조 공식: 회원별 balance 증감 = held_amount − (fare_share + fee_amount) + uncovered_amount (방장은 + actual_fare)
      - 방별 택시팟 부담 = (actual_fare − Σfare_share)(끝수) + Σuncovered_amount(미수금 회수 전)
      - HOST_PAYOUT은 지갑 잔액 상한(1,000,000원) 검사를 하지 않는다 (이미 탄 택시비라 정산이 실패하면 안 됨)
    - 미수금 납부: DEBT_PAY(−납부액, pot_id = 해당 방). 부분 납부 가능
      - 자동 납부 (3.5.0): CHARGE·ADMIN_ADJUST(+) 기록 직후 같은 트랜잭션에서 미수금(UNPAID·OVERDUE)을 debt_due_at 빠른 순으로
        DEBT_PAY(−min(balance, debt_amount)) 처리. 잔액이 남으면 다음 미수금으로 넘어감
    - 출금 (3.5.0): WITHDRAW(−출금액, withdrawal_id 연결). 송금 실패 시 WITHDRAW_REFUND(+출금액, 같은 withdrawal_id)
    - 탈퇴: BALANCE_EXPIRE(−남은 balance, pot_id = NULL), balance = 0. 잔액이 0이면 기록 없음
    - FARE_ADJUST(6차 방식 추가 차감)는 3.3.0부터 기록하지 않음 (과거 행 조회용 코드로만 유지)
    - 충전: CHARGE(+금액, payment_id 연결, PORTONE 승인 시에만 — 3.7.0: PORTONE 연동은 캡스톤 범위 외라 시연에서는 기록되지 않음)
    - 충전 환불: CHARGE_REFUND — 3.7.0에서 폐지(출금으로 통일). 과거 내역 조회용 코드값으로만 남음
    - 운영자 잔액 조정(시연용): ADMIN_ADJUST(±금액, payment_id = NULL) — 실제 PG 충전(CHARGE)과 구분. 3.3.0부터 시연 충전은 이 방법만 사용
    - DB CHECK: CHARGE·CHARGE_REFUND만 payment_id 필수, 나머지 유형은 payment_id = NULL / WITHDRAW·WITHDRAW_REFUND만 withdrawal_id 필수 (9차) / balance_after >= 0

    ## 미수금 (16일 회의: 못 걷은 금액 처리)
    - 정산 때 uncovered_amount > 0이면 SETTLEMENT.debt_status = UNPAID, debt_amount = uncovered_amount, debt_due_at = settled_at(운영자 승인 시각) + 3일(3.4.0, 설정값 `app.debt.due-days=3`), PAYMENT 알림
    - 납부 방법 (3.5.0): ① 충전(PORTONE 승인, 캡스톤 범위 외)·운영자 잔액 조정(+, 시연) 직후 자동 납부, ② `POST /api/wallet/debts/{settlementId}/pay`로 지갑 잔액에서 직접 납부(부분 납부 가능)
      - 7차의 '이후 충전 시 자동 회수 안 함'을 3.5.0에서 변경
    - 기한까지 다 내지 않으면 스케줄러가 debt_status = OVERDUE로 바꾼다. debt_amount는 그대로 (3.4.0)
      - '기한 경과 시 10배'와 법적 조치 경고는 가입 약관에만 명시하고, 서버는 금액을 늘리거나 지갑에서 추가로 빼가지 않는다 (관련 코드 없음)
      - 앱은 OVERDUE면 '납부 기한이 지났습니다' 경고와 약관 안내를 보여준다
    - debt_amount가 0이 되면 PAID, debt_paid_at = now. uncovered_amount는 정산 당시 부족분 기록으로 그대로 둔다
    - 미수금(UNPAID·OVERDUE)이 있으면 허용 목록 외 모든 기능 차단 (공통 규칙 '미수금 이용 제한', 409 UNPAID_DEBT_EXISTS, 3.5.0 확정)
    - debt_amount 최대 = 1인 분담금 최대 500,000 + 수수료 1,000 = 501,000원 (금액 변동 없음). 잔액이 모자랄 수 있어 부분 납부를 허용한다
    - 미수금 부담: 못 걷은 금액은 택시팟이 정산 때 방장에게 대신 지급(HOST_PAYOUT에 포함). 시연에서는 이 운영자 부담분을 시연용 데이터로 처리한다

    ## 실요금 청구·운영자 확인 (3.5.0)
    - 흐름: 탑승 시작(RUNNING, started_at 기록) → 하차 후 방장이 `POST /api/pots/{potId}/fare-claim`(결제내역 사진 + 실요금) → fare_claim_status = PENDING
      → 운영자가 `PATCH /api/admin/pots/{potId}/fare-claim`으로 사진과 금액을 대조
      - 승인(APPROVED): 위 '포인트 원장 기록 규칙'의 정산 실행 → TAXIPOT COMPLETED, settled_at = 승인 시각, 평가 요청 알림(평가 기간 24시간은 이때부터)
      - 반려(REJECTED): 반려 사유와 함께 방장에게 알림, 방장이 다시 청구 (actual_fare·receipt_img_path 덮어씀, 반려 사유 초기화)
    - 청구 기한: 탑승 시작 + 24시간(설정값 `app.fare-claim.deadline-hours=24`)까지 청구가 없으면 스케줄러 9번이 OVERDUE + 운영자·방장 알림
      - 방장은 OVERDUE에서도 청구 가능 (→ PENDING). 운영자는 장애 복구 일괄 입력(`POST /api/admin/pots/batch-status`)으로 직접 정산하거나 전액 환불
    - 탑승자 잠금 해제: 청구 접수(PENDING·REJECTED) 이후·OVERDUE 방은 '진행 중인 다른 방'에서 제외 (예치금은 정산까지 묶임)
    - 운영자 확인 기준(권장): 사진의 결제 금액 = 청구 금액, 결제 일시가 탑승 시작 이후, 예상 요금 대비 크게 벗어나면 주의(응답 fareRatio = actualFare ÷ expectedFare)
    - 실요금 부풀리기 방지: 방장 정산금(HOST_PAYOUT)은 운영자 승인 금액으로만 지급

    ## 출금 (3.5.0)
    - 가입 시 본인 명의 계좌 1개 등록 필수 (USERS.bank_code·account_no·account_holder). 예금주 = 가입 이름, 계좌번호는 AES-256-GCM 암호화, 응답은 마스킹
      - 9차 이전 가입자는 계좌가 NULL → `PUT /api/users/me/account`로 등록 후 출금 (미등록 출금은 409 ACCOUNT_NOT_REGISTERED)
    - 출금 가능 금액 (3.7.0 확정): 사용 가능 잔액(balance) 전체, 1회 1,000원 이상. 예치금(held_balance)은 출금 불가. 정지 중에도 출금 가능, 미수금이 있으면 불가(이용 제한)
    - 송금 (3.6.0 확정): 시연은 실제 송금 없이 더미 송금(transfer_provider = DUMMY)으로 즉시 완료 처리, 거래번호 `DUMMY-{UUID}` 발급. 실제 송금 연동은 캡스톤 범위 외
      - 실패 시 FAILED + WITHDRAW_REFUND로 잔액 복구 (시연에서 실패를 보이려면 설정값 `app.withdrawal.dummy-fail-amount`와 같은 금액을 요청)
    - 충전 환불 API는 3.7.0에서 폐지 — 지갑 잔액을 돌려받는 방법은 출금으로 통일 (3.7.0 확정: 사용 가능 잔액 전체 출금 가능)
    ## 동시성 제어 (회원 1명 = 활성 방 1개 보장)
    - DB에는 '회원별 활성 참여 1개' 고유 제약이 없으므로 서버가 회원 행 락으로 보장한다
    - 방 생성·참여·입장 요청·수락·참여 취소·충전·환불·정산·미수금 납부 등 지갑이나 참여 상태를 바꾸는 트랜잭션은 아래 순서로만 락을 잡는다 (순서 고정 → 데드락 방지)
      1. USERS (요청자 본인 행) `SELECT ... FOR UPDATE`
      2. WALLET (요청자 지갑 행) `SELECT ... FOR UPDATE`
      3. TAXIPOT (대상 방 행) `SELECT ... FOR UPDATE`
      - 여러 회원을 다루는 작업(정산, 방 취소, 스케줄러 퇴장·자동 취소)은 USERS·WALLET을 member_id 오름차순으로 잠근 뒤 TAXIPOT을 잠근다
      - 방장이 다른 회원을 처리하는 작업(내보내기, 입장 요청 수락)은 요청자(방장) 행이 아니라 '대상 회원'의 USERS → WALLET → TAXIPOT 순으로 잠근다
    - 같은 이유로 '진행 중인 다른 방' 검사에 REQUESTED도 포함한다 (한 회원이 두 방에 동시에 입장 요청 → 둘 다 수락되는 문제 방지)
    - 회원 행을 먼저 잠근 상태에서 '진행 중인 다른 방'(핵심 정책 정의) 참여 여부를 검사하므로, 같은 회원이 서로 다른 방에 동시에 요청해도 두 번째 요청은 첫 번째 커밋 후 검사되어 ACTIVE_POT_EXISTS로 막힘
    - Spring Data JPA: `@Lock(LockModeType.PESSIMISTIC_WRITE)` 조회 메서드 사용, 서비스 메서드는 `@Transactional`
    - 정원 초과는 TAXIPOT 락 이후 current_members < max_members 재검사로 방지, 잔액은 WALLET 락 이후 재검사

    ## ErrorResponse.detail 규격
    - detail은 앱이 안내 문구·팝업을 만들 때 쓰는 추가 정보. 아래 코드는 반드시 해당 필드를 채운다 (그 외 코드는 null)
      - INSUFFICIENT_BALANCE: requiredAmount(필요 예치액), balance(현재 잔액), shortageAmount(부족액) → "3,000원이 부족합니다. 충전하시겠습니까?"
      - SUSPENDED_USER: suspendedUntil(해제 시각, 영구 정지면 null) — 정지 사유는 보여주지 않으므로 reason 필드 없음 (3.3.0)
      - OUT_OF_ARRIVAL_RANGE: distanceMeters(현재 거리), allowedRadiusMeters(인정 반경)
      - CANCEL_TIME_EXPIRED: cancelDeadline(취소 가능 마감 시각)
      - ARRIVAL_DEADLINE_PASSED: arrivalDeadline
      - ACTIVE_POT_EXISTS: activePotId(이미 참여 중인 방 번호)
      - GENDER_RESTRICTED: genderOption(방의 성별 제한 값)
      - POT_FULL: maxMembers, currentMembers
      - NOT_VERIFIED: emailStatus, reviewStatus(가장 최근 인증 행 기준, 없으면 null)
      - WALLET_LIMIT_EXCEEDED: maxBalance(1,000,000), availableAmount(추가 충전 가능액)
      - INVALID_DATETIME_FORMAT: field(문제 필드명), value(받은 값)
      - INVALID_EMAIL_CODE: remainingAttempts(남은 입력 가능 횟수, 0이면 재발송 필요)
      - JOIN_DEADLINE_PASSED: joinDeadline(참여 마감 시각) → 앱은 '입장 요청' 버튼으로 전환
      - DEPARTURE_TIME_TOO_SOON: minDepartureTime(지금 생성 가능한 가장 이른 출발 시각)
      - DEPARTURE_TIME_TOO_FAR: maxDepartureTime(지금 생성 가능한 가장 늦은 출발 시각 = 현재 + 24시간, 3.4.0)
      - UNPAID_DEBT_EXISTS: debtAmount(남은 미수금 합계), debtDueAt(가장 이른 납부 기한, 연체만 있으면 null)
    - 응답 예시는 components.examples 참고

    ## 실시간 통신 (REST 아님)
    - Spring WebSocket + STOMP. 엔드포인트 `/ws` 연결 시 CONNECT 헤더에 `Authorization: Bearer {accessToken}`
    - 방 참여자는 `/topic/pots/{potId}` 구독 (서버가 참여자 여부 검증)
    - 서버 → 앱 메시지 type: `CHAT_MESSAGE`(새 메시지), `POT_UPDATED`(인원·상태·도착·입장 요청 변경)
      - 입장 요청자는 아직 참여자가 아니라 구독 불가 → 수락·거절 결과는 POT 알림(FCM)으로 받는다
    - 메시지 저장은 REST(`POST /api/pots/{potId}/messages`)로 하고 서버가 브로드캐스트

    ## 서버 배치(스케줄러) 작업 — API 아님
    (Spring `@Scheduled`로 구현, 각 작업은 위 동시성 제어의 락 순서를 따른다)
    1. 미도착 자동 퇴장 (1분 주기, 대상: RECRUITING·CLOSED이고 arrival_deadline <= now인 방): arrived_at이 NULL인 JOINED 동승자를 NO_SHOW로 변경,
       canceled_at = now, no_show_count + 1, 예치금 전액 환불(SETTLEMENT → REFUNDED, fare_share NULL), 15분 정지(정지 규칙 통일: 더 긴 쪽 유지),
       current_members − 1, has_canceled = 1, CLOSED였다면 RECRUITING, KICKED 알림.
       방장이 미도착이면 자동 해산(TAXIPOT → CANCELED) 후 전원 환불, 방장도 같은 노쇼 처리(NO_SHOW·no_show_count + 1·15분 정지), 남은 REQUESTED → CANCELED(3.5.0), 참여자·요청자에게 POT 알림
    2. 방장 단독 방 자동 해산 (1분 주기, 3.3.0, 3.4.0 확정): departure_time <= now, status = RECRUITING, current_members = 1인 방 → CANCELED, 방장 예치금 전액 환불(정지 없음),
       남은 REQUESTED → CANCELED, 방장·요청자에게 POT 알림 (출발 시각 전까지는 입장 요청 수락으로 인원을 채울 수 있음)
    3. 미출발 방 자동 취소 (1분 주기, 3.3.0): departure_time + 30분 <= now이고 RECRUITING·CLOSED인 방 → CANCELED, 전원 환불(정지 없음), REQUESTED → CANCELED, POT 알림
    4. 지각 경고 (1분 주기): 집결 기한 N분 전까지 미도착인 참여자에게 LATE_WARNING 알림 (N은 서버 설정값)
    5. 정지 만료 해제 (1분 주기): suspended_until <= now인 SUSPENDED 회원을 ACTIVE로 (NULL = 영구 정지는 제외, 운영자만 해제)
    6. 탈퇴 회원 개인정보 파기 (일 1회): withdrawn_at + 14일 <= now인 회원의 email·pw_hash·name·phone·gender·student_no·fcm_token → NULL,
       bank_code·account_no·account_holder → NULL, WITHDRAWAL 계좌 스냅샷(bank_code·account_no·account_holder) → NULL (3.5.0),
       nickname → '탈퇴회원_{id}', STUDENT_VERIFICATION 해당 행 DELETE + 캡처 파일 삭제
    7. 평가 미제출 기본값 (1시간 주기): 정산 완료 24시간 후에도 미제출인 평가쌍에 4항목 ★3·is_default = 1 행 INSERT (평점 변동 없음)
       - INSERT는 `INSERT IGNORE`(또는 UNIQUE 위반 무시)로 처리 — 같은 순간 회원 제출과 겹쳐도 배치가 멈추지 않게
    8. 미수금 연체 표시 (10분 주기, 3.3.0): debt_status = UNPAID이고 debt_due_at <= now → OVERDUE, PAYMENT 알림(기한 경과·약관 안내). debt_amount는 바꾸지 않음 (3.4.0)
    9. 실요금 청구 기한 경과 (10분 주기, 3.5.0): status = RUNNING, fare_claim_status = NONE, started_at + 24시간 <= now → fare_claim_status = OVERDUE,
       운영자(role = ADMIN) SYSTEM 알림('정산 청구 없음 — 확인 필요') + 방장 PAYMENT 알림('결제내역을 올려 정산을 청구해 주세요')
    10. 영수증 사진 파기 (일 1회, 3.6.0): receipt_img_path가 있는 방 중 ① COMPLETED이고 fare_reviewed_at + 90일 <= now,
        또는 ② CANCELED이고 updated_at + 90일 <= now(청구 후 승인 없이 취소된 방) → 서버 파일 삭제 후 receipt_img_path = NULL
        - 파일 삭제 실패 시 DB 값은 그대로 두고 다음 실행 때 재시도 (설정값 `app.receipt.retention-days=90`)
    11. 출발 확인 알림 (30초 주기, 3.7.0): status가 RECRUITING·CLOSED, start_reminded_at IS NULL, 남은 JOINED가 2명 이상이고 전원 arrived_at NOT NULL,
        MAX(arrived_at) + 3분 <= now → 방장에게 POT 알림('모두 모였어요. 출발했다면 탑승 시작 버튼을 눌러주세요'), start_reminded_at = now
        - 1회만 발송 (이후 입장 요청 수락으로 인원이 바뀌어도 재발송 안 함). 설정값 `app.pot.start-reminder-minutes=3`
    - 1·2·3번은 같은 방을 동시에 처리하지 않도록 방 단위 트랜잭션 + TAXIPOT 행 락 후 상태를 다시 확인하고 처리한다 (API와 동시에 실행돼도 이중 환불 없음)
    - 시연 팁: 스케줄러 주기와 15분·24시간·30분·3일·청구 기한 24시간·영수증 보관 90일·출발 확인 알림 3분 같은 시간 값은 모두 application.yml 설정값으로 두고, 시연용 프로필에서 짧게 줄인다

    ## 공통 에러 코드 (ErrorResponse.code)
    - 400: INVALID_INPUT, INVALID_DATETIME_FORMAT, TERMS_NOT_AGREED, INVALID_EMAIL_CODE, EXPIRED_EMAIL_CODE, STUDENT_NO_MISMATCH,
      OUT_OF_ARRIVAL_RANGE, BAD_REASON_REQUIRED, SELF_RATING_NOT_ALLOWED, SELF_REPORT_NOT_ALLOWED, REJECT_REASON_REQUIRED,
      PAYMENT_AMOUNT_MISMATCH, PAYMENT_FAILED, INVALID_QUICK_MESSAGE,
      RESERVED_NICKNAME, UNSUPPORTED_UNIVERSITY, EMAIL_DOMAIN_MISMATCH, DUMMY_CHARGE_NOT_ALLOWED, DEPARTURE_TIME_TOO_SOON,
      RECEIPT_REQUIRED, BALANCE_FORFEIT_NOT_AGREED (3.3.0), DEPARTURE_TIME_TOO_FAR (3.4.0), ACCOUNT_HOLDER_MISMATCH (3.5.0)
    - 401: UNAUTHORIZED(토큰 없음·만료), INVALID_CREDENTIALS, TOKEN_REVOKED(탈퇴·비밀번호 변경으로 무효가 된 토큰, 3.3.0)
    - 403: FORBIDDEN(권한 없음·운영자 전용), WITHDRAWN_USER, NOT_VERIFIED, SUSPENDED_USER, GENDER_RESTRICTED, NOT_POT_HOST,
      NOT_POT_MEMBER, KICKED_FROM_POT, HOST_CANNOT_LEAVE, EMAIL_NOT_VERIFIED, REPORT_NOT_ELIGIBLE, JOIN_REQUEST_REJECTED (3.3.0)
    - 404: NOT_FOUND
    - 409: DUPLICATE_EMAIL, DUPLICATE_NICKNAME, DUPLICATE_STUDENT_NO, ALREADY_VERIFIED, REVIEW_IN_PROGRESS, INSUFFICIENT_BALANCE,
      ACTIVE_POT_EXISTS, ALREADY_JOINED, POT_FULL, INVALID_POT_STATUS, CANCEL_TIME_EXPIRED, ALREADY_ARRIVED, ARRIVAL_DEADLINE_PASSED,
      MEMBER_ALREADY_ARRIVED, NOT_ALL_ARRIVED, NOT_ENOUGH_MEMBERS, ALREADY_SETTLED, ALREADY_RATED, DUPLICATE_REPORT,
      ALREADY_REVIEWED, ALREADY_PROCESSED, PAYMENT_ALREADY_PROCESSED, INVALID_PAYMENT_STATUS, WALLET_LIMIT_EXCEEDED,
      JOIN_DEADLINE_PASSED, JOIN_REQUEST_NOT_AVAILABLE, ALREADY_REQUESTED, JOIN_REQUEST_NOT_FOUND, UNPAID_DEBT_EXISTS, NO_DEBT,
      CAPTURE_NOT_SUBMITTED, EMAIL_CODE_ATTEMPTS_EXCEEDED, RATING_PERIOD_EXPIRED (3.3.0),
      ACCOUNT_NOT_REGISTERED, FARE_CLAIM_IN_REVIEW, FARE_CLAIM_NOT_PENDING, PAYMENT_CHECK_FAILED (3.5.0)
    - 429: TOO_MANY_REQUESTS (이메일 인증코드 재발송 간격 60초 이내 재요청, 3.9.0)

    ## 16일 회의로 확정된 이전 협의 사항
    - 방장 정산금 → 정산 때 방장에게 실요금 전액 입금(HOST_PAYOUT), 못 걷은 금액도 택시팟이 지급
    - 도착 인정 반경 → 50m / 정원 미달 출발 → 남은 참여자 전원 도착 + 2명 이상이면 출발
    - 탈퇴 시 지갑 잔액 → 소멸(약관 명시) / 미수 부족분 → 미수금 3일 납부, 10배·법적 조치는 약관 문구만(코드 없음) / 정지 사유 → 저장·노출 안 함
    - 수수료 → 정산 시 탑승자에게만 1,000원 / 방장 단독 방 → 출발 시각에 패널티 없이 자동 해산 / 입장 요청 → 참여 마감~탑승 시작 전
    - 신고 → 중간 취소자는 그 방 누구도 신고 불가 / 방 생성 → 출발 15분 전까지, 최대 24시간 이내 / 인증코드 5회 → 입력 시도 횟수
    - 컬럼명 → canceled_at 유지 (회의 요약의 cancelled_at 표기는 오기)
    - (3.5.0) 미수금 → 허용 목록 외 전 기능 차단·입금 시 자동 납부 / 끝수 → 택시팟 부담 / 정산금 → 가입 시 등록한 계좌로 출금(시연 더미 송금)
    - (3.5.0) 실요금 → 방장 청구 후 운영자 확인, 24시간 내 미청구는 운영자 처리 / 탈퇴 시 결제 대기 충전 → 취소(FAILED)
    - (3.6.0) 캡처 미제출 → NOT_SUBMITTED / 영수증 사진 → 정산 승인 후 90일 보관 / 출금 송금 → 시연은 더미, 실제 연동은 범위 외
    - (3.7.0) 미출발 방 → 30분 후 자동 취소 + 전원 도착 3분 후 방장 알림 / PORTONE → 범위 외, 시연 충전은 운영자 조정 / 예치금 → 예상 분담금 1.2배
    - (3.7.0) 출금 → 사용 가능 잔액 전체 / 충전 환불 → 폐지, 출금으로 통일
    - (3.8.0) 미수금 이용 제한 → 예외 없음 (이미 참여 중인 방도 차단)
    - (3.9.0) 이메일 인증코드 유효 시간 → 1분 / 재발송 간격 → 60초

    ## 협의 필요 (아직 확정되지 않아 이 명세가 가정한 부분 — DB 설계서 13차 기준)
    - 없음 (3.9.0 기준 모든 협의 항목 확정)

    ## DB 설계서 7차~13차 대응 (8차·10차·12차·13차는 스키마 변경 없음, 9차·11차 변경은 DDL 시트의 ALTER문)
    - 13차: 스키마 변경 없음 — STUDENT_VERIFICATION.email_code_expires_at = 발송 시각 + 1분, email_code·email_code_expires_at 비고에 재발송 간격 60초 추가
    - 11차: TAXIPOT.start_reminded_at 추가
    - 9차: USERS 출금 계좌 3컬럼(bank_code·account_no·account_holder), TAXIPOT started_at·fare_claim_status·fare_claimed_at·fare_reviewed_at·fare_reject_reason,
      WITHDRAWAL 신규, POINT_HISTORY withdrawal_id + WITHDRAW·WITHDRAW_REFUND
    - UNIVERSITY 신규, USERS.university → UNIVERSITY.name FK
    - USERS: token_version 추가, phone VARCHAR(255)(암호문), CHECK chk_users_nickname_reserved
    - STUDENT_VERIFICATION: email_code_attempts 추가, capture_img_url → capture_img_path(VARCHAR 255), review_status VARCHAR(15) + NOT_SUBMITTED
    - TAXIPOT: receipt_img_path 추가 / TAXIPOT_MEMBER.status: REQUESTED·REJECTED 추가
    - SETTLEMENT: fee_amount NULL 허용(DEFAULT 제거), debt_status·debt_amount·debt_due_at·debt_paid_at 추가
    - RATING: is_default 추가 / POINT_HISTORY.type: FARE_PAY·HOST_PAYOUT·DEBT_PAY·BALANCE_EXPIRE 추가
    - 서버는 DB CHECK 위반(SQLState 23000, MySQL 3819)을 500으로 내보내지 말고 로그를 남긴 뒤 409 INVALID_POT_STATUS 등 의미에 맞는 코드로 변환
      (CHECK는 서버 검증 누락을 잡는 마지막 안전장치 — 정상 흐름에서는 서버 검증이 먼저 걸러야 함)
    - JDBC URL에 `characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci` 지정 ('탈퇴회원_' CHECK·한글 데이터 깨짐 방지)

    ## 통합 시 정리한 내용 (기존 명세 대비)
    - 경로: `/api/pots` 사용 (`/api/taxipots` 통일). 참여·취소·좌석·도착은 `/api/pots/{potId}/members/...` 리소스 방식으로 통일
    - 가입 전 이메일 인증 방식 삭제: STUDENT_VERIFICATION.member_id가 NOT NULL FK라 회원 행이 먼저 있어야 함 → 가입 시 인증 행 생성 + 코드 발송
    - 방 폭파(방장 미도착) API 삭제: 스케줄러 1번 작업(자동 해산)과 처리가 같아 스케줄러로 일원화
    - 딥링크 생성 API·지도 마커 전용 API 삭제: 상세·목록 응답의 좌표로 앱에서 처리
    - 내 정지 현황 API → 내 정보 조회 응답에 포함 / 내 정산 내역 API → 내 이용 기록 응답에 포함
    - 통계 API 3개 → 1개로 통합
    - 방 수정은 제목·오픈채팅 링크만 (시간·요금 변경은 예치금 재계산이 필요해 제외, 혼자일 때 취소 후 재생성)

servers:
  - url: http://localhost:8080
    description: Local Server

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: 회원가입·로그인·토큰
  - name: Verification
    description: 이메일 인증·학생 정보 캡처본 제출 (STUDENT_VERIFICATION)
  - name: User
    description: 내 정보·이용 기록·공개 프로필 (USERS)
  - name: Wallet
    description: 가상 지갑·포인트 원장·출금 (WALLET, POINT_HISTORY, WITHDRAWAL)
  - name: Payment
    description: 포인트 충전 결제 (PAYMENT)
  - name: Pot
    description: 택시팟 방 생성·조회·수정·취소·출발 (TAXIPOT)
  - name: PotMember
    description: 참여·취소·좌석·도착 확인·내보내기 (TAXIPOT_MEMBER)
  - name: Settlement
    description: 실요금 청구·정산 조회 (SETTLEMENT, TAXIPOT.fare_claim_*)
  - name: Rating
    description: 동승자 평가 (RATING)
  - name: Report
    description: 신고 (REPORT)
  - name: Chat
    description: 채팅·퀵블록 (CHAT_MESSAGE)
  - name: Notification
    description: 알림 (NOTIFICATION)
  - name: Admin
    description: 운영자 웹 전용 (role = ADMIN)

paths:

  # =========================
  # AUTH API
  # =========================

  /api/auth/signup:
    post:
      tags:
        - Auth
      summary: 회원가입
      description: |
        하나의 트랜잭션으로 USERS(is_verified = 0), WALLET(잔액 0), STUDENT_VERIFICATION(email_status = PENDING, student_no = 가입 학번) 행을 생성하고
        대학교 이메일로 인증코드를 발송한다. 응답으로 토큰을 바로 발급해 이후 이메일 인증 → 캡처본 제출을 이어서 진행한다.
        - 필수 약관 동의(agreeRequired = true)가 아니면 가입 불가, agreed_at은 서버 시각
        - 비밀번호는 BCrypt 해시 후 pw_hash에 저장, 휴대폰번호는 정규화 후 AES-256-GCM 암호화해 저장
        - 같은 학교 + 학번 중복 가입 불가 (탈퇴 14일 후 파기된 학번은 재가입 가능)
        - 검증 순서 (3.3.0): 입력 형식 → 닉네임 예약어('탈퇴회원_' 시작이면 RESERVED_NICKNAME) → 학교(UNIVERSITY 목록·is_active = 1, 아니면 UNSUPPORTED_UNIVERSITY)
          → 이메일 도메인(소문자 비교, '@' 뒤가 학교 email_domain과 정확히 일치해야 함, 아니면 EMAIL_DOMAIN_MISMATCH) → 중복(이메일·닉네임·학번)
        - 중복 검사는 사전 조회 + DB UNIQUE 위반(DataIntegrityViolationException) 변환을 함께 사용 (동시 가입 대비)
        - 발급 토큰의 claim tv = 0 (USERS.token_version 초기값)
        - 출금 계좌 (3.5.0): bankCode는 `GET /api/banks` 목록 코드, accountNumber는 하이픈 제거 후 숫자 10~14자리, accountHolder는 name과 같아야 함(아니면 400 ACCOUNT_HOLDER_MISMATCH)
          계좌번호는 AES-256-GCM 암호화 저장. 시연은 실제 예금주 조회 없이 이름 비교만
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "200":
          description: 가입 성공 (인증 전 상태로 토큰 발급)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: INVALID_INPUT / TERMS_NOT_AGREED / RESERVED_NICKNAME / UNSUPPORTED_UNIVERSITY / EMAIL_DOMAIN_MISMATCH / ACCOUNT_HOLDER_MISMATCH
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                reservedNickname:
                  $ref: "#/components/examples/ReservedNickname"
        "409":
          description: DUPLICATE_EMAIL / DUPLICATE_NICKNAME / DUPLICATE_STUDENT_NO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/nickname-check:
    get:
      tags:
        - Auth
      summary: 닉네임 사용 가능 여부 확인
      description: |
        중복이면 available = false, reason = DUPLICATE. '탈퇴회원_'으로 시작하면 available = false, reason = RESERVED
        → 앱 안내 문구 '이후 사용할 수 없는 닉네임입니다' (3.3.0)
      security: []
      parameters:
        - name: nickname
          in: query
          required: true
          schema:
            type: string
            maxLength: 30
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"

  /api/universities:
    get:
      tags:
        - Auth
      summary: 가입 가능 대학교 목록 조회 (3.3.0)
      description: |
        UNIVERSITY에서 is_active = 1인 학교를 이름순으로 반환. 가입 화면의 학교 선택 목록으로 사용하고,
        SignupRequest.university에는 응답의 name을 그대로 보낸다. 이메일 입력란 뒤에 '@' + emailDomain을 안내하면 도메인 오류를 줄일 수 있다.
      security: []
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UniversityResponse"

  /api/banks:
    get:
      tags:
        - Auth
      summary: 출금 계좌 은행 목록 조회 (3.5.0)
      description: 가입·계좌 변경 화면의 은행 선택 목록. 서버 상수(은행 코드·이름)를 이름순으로 반환
      security: []
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BankResponse"
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: 로그인 (학생 앱·운영자 웹 공용)
      description: |
        응답의 user.role로 운영자 여부를 구분한다.
        - 탈퇴(WITHDRAWN) 회원은 로그인 불가
        - 정지(SUSPENDED) 회원은 로그인 가능 (조회·채팅만 허용)
        - fcmToken을 함께 보내면 USERS.fcm_token 갱신
        - 발급 토큰 claim tv = 현재 USERS.token_version
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: WITHDRAWN_USER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/refresh:
    post:
      tags:
        - Auth
      summary: 액세스 토큰 재발급
      description: |
        리프레시 토큰은 DB에 저장하지 않는 서명 검증형 JWT (별도 테이블 없음).
        리프레시 토큰의 claim tv가 USERS.token_version과 다르거나 탈퇴 회원이면 401 TOKEN_REVOKED (3.3.0)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: 재발급 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: 로그아웃
      description: 해당 기기의 푸시 수신을 막기 위해 USERS.fcm_token을 NULL로 변경. 토큰 폐기는 앱에서 삭제로 처리
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  # =========================
  # VERIFICATION API
  # =========================

  /api/verifications/email-code:
    post:
      tags:
        - Verification
      summary: 이메일 인증코드 재발송
      description: |
        email_status = PENDING인 가장 최근 STUDENT_VERIFICATION 행의 email_code와 email_code_expires_at(발송 시각 + 1분, 서버 설정값 — 3.9.0에서 5분 → 1분)을 갱신하고
        email_code_attempts = 0으로 초기화한 뒤 재발송한다 (3.3.0).
        (최초 발송은 회원가입 시 자동 처리)
        - 회원의 인증 행 중 email_status = VERIFIED인 행이 하나라도 있으면 이메일 인증 완료로 보고 409
        - 재발송 간격 (3.9.0): 직전 발송 후 60초(서버 설정값 `app.verification.resend-interval-seconds=60`)가 지나야 재발송 가능
          - 직전 발송 시각 = email_code_expires_at − 1분 (가입 시 최초 발송도 포함)
          - 60초 안의 요청은 코드·만료 시각·실패 횟수를 바꾸지 않고 메일도 보내지 않은 채 429 TOO_MANY_REQUESTS (detail = null)
          - 재발송 때 실패 횟수가 0으로 초기화되므로, 이 간격이 인증코드 반복 대입을 막는 역할도 한다
      responses:
        "200":
          description: 발송 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailCodeSendResponse"
        "409":
          description: ALREADY_VERIFIED (이메일 인증 완료)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: TOO_MANY_REQUESTS (직전 발송 후 60초 이내 재요청, 3.9.0)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/verifications/email-code/confirm:
    post:
      tags:
        - Verification
      summary: 이메일 인증코드 확인 (1차 인증)
      description: |
        email_status = PENDING인 가장 최근 인증 행의 코드·만료 시각을 검증하고 email_status = VERIFIED로 변경.
        캡처본 재제출로 생긴 행(email_status = VERIFIED로 복사됨)의 email_code는 검증 대상이 아니다.
        - 입력 실패 제한 (3.3.0): 검증 순서 = 실패 횟수(email_code_attempts ≥ 5면 409 EMAIL_CODE_ATTEMPTS_EXCEEDED) → 만료(EXPIRED_EMAIL_CODE) → 코드 일치
          - 코드가 틀리면 email_code_attempts + 1 후 400 INVALID_EMAIL_CODE (detail.remainingAttempts = 5 − 증가 후 값)
          - 5회째 실패하면 remainingAttempts = 0, 이후에는 맞는 코드여도 EMAIL_CODE_ATTEMPTS_EXCEEDED → 재발송으로만 해제
          - 주의(Spring): 실패 횟수 증가는 예외를 던져도 커밋돼야 하므로 `@Transactional(noRollbackFor = BusinessException.class)` 또는
            별도 트랜잭션(`REQUIRES_NEW`)에서 증가시킨다. 그냥 예외를 던지면 롤백되어 횟수가 늘지 않음
          - 동시 입력으로 6 이상이 되지 않게 `UPDATE ... SET email_code_attempts = email_code_attempts + 1 WHERE id = ? AND email_code_attempts < 5`로 증가
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailCodeConfirmRequest"
      responses:
        "200":
          description: 인증 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationResponse"
        "400":
          description: INVALID_EMAIL_CODE(detail.remainingAttempts) / EXPIRED_EMAIL_CODE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: EMAIL_CODE_ATTEMPTS_EXCEEDED (5회 실패, 재발송 필요) / ALREADY_VERIFIED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/verifications/capture:
    post:
      tags:
        - Verification
      summary: 학생 기본 정보 캡처본 제출 (2차 인증, 반려 후 재제출 포함)
      description: |
        종합정보시스템 학생 기본 정보 화면(학번·학적·성별) 캡처를 업로드한다.
        - 이메일 인증(VERIFIED) 완료 후에만 제출 가능
        - 제출 학번이 가입 학번(USERS.student_no)과 다르면 즉시 400 (STUDENT_NO_MISMATCH)
        - 이미지는 서버 로컬 폴더(`{app.upload-dir}/captures/{memberId}/{UUID}.jpg|png`)에 저장하고 capture_img_path에 상대 경로 저장 (3.3.0)
        - 최근 행이 캡처 미제출(review_status = NOT_SUBMITTED)이면 그 행에 capture_img_path 저장 + review_status = PENDING
        - 최근 행이 PENDING이면 409 REVIEW_IN_PROGRESS, APPROVED면 409 ALREADY_VERIFIED
        - 반려(REJECTED) 후 재제출이면 새 행 생성. 이메일 인증 정보와 캡처 심사 정보는 아래처럼 분리해서 다룬다
          - email_status: 직전 행의 VERIFIED를 그대로 복사 (이메일 인증은 회원 단위로 한 번만 하면 됨)
          - email_code·email_code_expires_at: NOT NULL 컬럼이라 직전 행 값을 복사하지만 '보관용 값'일 뿐 검증에 쓰지 않음 (만료 여부와 무관)
          - review_status = PENDING, reject_reason·reviewed_at = NULL (심사는 새 행 기준)
        - 이메일 인증 여부 판단: 회원의 행 중 email_status = VERIFIED가 하나라도 있으면 완료 / 캡처 심사 상태: 가장 최근 행의 review_status
        - review_status = PENDING으로 운영자 심사 대기 (DB CHECK: NOT_SUBMITTED ⇔ capture_img_path NULL)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CaptureSubmitRequest"
      responses:
        "200":
          description: 제출 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationResponse"
        "400":
          description: INVALID_INPUT(이미지 형식 오류) / STUDENT_NO_MISMATCH
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: EMAIL_NOT_VERIFIED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: REVIEW_IN_PROGRESS (심사 대기 중 중복 제출) / ALREADY_VERIFIED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/verifications/me:
    get:
      tags:
        - Verification
      summary: 내 인증 진행 상태 조회
      description: |
        가장 최근 STUDENT_VERIFICATION 행 기준.
        앱 화면 분기: emailStatus = PENDING → 이메일 인증 / reviewStatus = NOT_SUBMITTED → 캡처 제출 / PENDING → 심사 대기 / REJECTED → 반려 사유 + 재제출 / APPROVED → 완료
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # =========================
  # USER API
  # =========================

  /api/users/me:
    get:
      tags:
        - User
      summary: 내 정보 조회
      description: 평점·신고 누적·무신고 연속 횟수·정지 상태를 포함 (정지 안내 화면에도 사용)
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

    patch:
      tags:
        - User
      summary: 내 정보 수정
      description: |
        닉네임·휴대폰번호·마케팅 수신 동의만 수정 가능 (이름·성별·학번은 인증 정보라 수정 불가). 변경할 항목만 전달
        - 닉네임이 '탈퇴회원_'으로 시작하면 400 RESERVED_NICKNAME (3.3.0)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfileResponse"
        "400":
          description: INVALID_INPUT / RESERVED_NICKNAME
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                reservedNickname:
                  $ref: "#/components/examples/ReservedNickname"
        "409":
          description: DUPLICATE_NICKNAME
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/users/me/withdraw:
    post:
      tags:
        - User
      summary: 회원 탈퇴 (논리 삭제)
      description: |
        비밀번호 확인이 필요해 Body를 받으므로 DELETE가 아닌 POST로 설계 (3.2.0에서 `DELETE /api/users/me` → 변경).
        status = WITHDRAWN, withdrawn_at = now, fcm_token = NULL, token_version + 1. 회원 행은 이용·정산 기록 보존용으로 남긴다.
        - 검증 순서: 비밀번호 → agreeBalanceForfeit = true(아니면 400 BALANCE_FORFEIT_NOT_AGREED) → 진행 중인 참여·입장 요청·HELD 정산(409 ACTIVE_POT_EXISTS)
          → 미수금(UNPAID·OVERDUE, 409 UNPAID_DEBT_EXISTS — 이용 제한 인터셉터에서 먼저 막힘) → 결제 대기 충전 정리
        - 결제 대기 충전 정리 (3.5.0, PORTONE 연동 시에만 해당 — 시연에서는 PENDING 결제가 생기지 않음): PAYMENT status = PENDING 건마다 포트원 결제 조회 → 결제 완료 상태면 PG 결제 취소, 어느 경우든 status = FAILED (포인트 지급 없음)
          - PG 조회·취소가 실패하면 탈퇴를 진행하지 않고 409 PAYMENT_CHECK_FAILED (앱은 잠시 후 재시도 안내)
        - 앱은 탈퇴 화면에서 잔액이 있으면 '출금 후 탈퇴'를 먼저 안내 (`POST /api/wallet/withdrawals`, 3.5.0)
        - 남은 지갑 잔액은 소멸 (3.3.0, 약관 명시): balance > 0이면 POINT_HISTORY BALANCE_EXPIRE(−balance), balance = 0
          - 앱은 탈퇴 확인 화면에 현재 잔액과 '남은 잔액은 소멸되며 환불되지 않습니다' 문구 + 동의 체크박스를 보여준다
        - token_version + 1로 이 기기를 포함한 모든 기기의 토큰이 즉시 무효 (이후 요청은 401 TOKEN_REVOKED)
        - 개인정보는 14일 후 배치(스케줄러 6번)로 파기
        - 성공 후 앱은 저장된 토큰을 삭제하고 로그인 화면으로 이동
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          description: BALANCE_FORFEIT_NOT_AGREED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: INVALID_CREDENTIALS (비밀번호 불일치)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: ACTIVE_POT_EXISTS / UNPAID_DEBT_EXISTS / PAYMENT_CHECK_FAILED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/users/me/password:
    patch:
      tags:
        - User
      summary: 비밀번호 변경
      description: |
        현재 비밀번호 확인 후 pw_hash 변경, token_version + 1 (3.3.0).
        - 다른 기기의 기존 토큰은 모두 무효(401 TOKEN_REVOKED). 이 기기는 응답의 새 토큰으로 교체해 로그인 상태를 유지한다
        - 3.2.0의 204 No Content → 3.3.0부터 200 + TokenResponse (앱 Retrofit 반환 타입을 `Response<Unit>` → `TokenResponse`로 변경)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
      responses:
        "200":
          description: 변경 성공 (새 토큰 발급, claim tv = 증가한 token_version)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: INVALID_CREDENTIALS (현재 비밀번호 불일치)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/users/me/account:
    get:
      tags:
        - User
      summary: 내 출금 계좌 조회 (3.5.0)
      description: 계좌번호는 마스킹해서 반환 (예 123-****-7890). 9차 이전 가입자처럼 미등록이면 404
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - User
      summary: 출금 계좌 등록·변경 (3.5.0)
      description: |
        현재 비밀번호 확인 후 USERS.bank_code·account_no·account_holder를 한 번에 교체 (본인 명의 1개만).
        - accountHolder는 USERS.name과 같아야 함 (아니면 400 ACCOUNT_HOLDER_MISMATCH), 계좌번호는 숫자만 남겨 AES-256-GCM 암호화
        - 이미 신청된 출금(WITHDRAWAL)에는 신청 시점 계좌 스냅샷이 남으므로 영향 없음
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdateRequest"
      responses:
        "200":
          description: 등록·변경 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "400":
          description: INVALID_INPUT / ACCOUNT_HOLDER_MISMATCH
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: INVALID_CREDENTIALS (비밀번호 불일치)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/users/me/fcm-token:
    put:
      tags:
        - User
      summary: FCM 푸시 토큰 등록·갱신
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FcmTokenRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /api/users/me/pots:
    get:
      tags:
        - User
      summary: 내 택시 이용 기록 조회
      description: |
        내가 방장이거나 참여한 택시팟 목록 (TAXIPOT_MEMBER 기준, 최신순).
        방 정보 + 내 참여 상태 + 내 정산 결과(SETTLEMENT)를 한 번에 반환하므로 '이용 기록'·'정산 내역' 화면에 함께 사용.
        - 입장 요청만 하고 참여하지 못한 행(REQUESTED·REJECTED, 또는 SETTLEMENT가 없는 행)은 제외 (3.3.0)
      parameters:
        - name: role
          in: query
          required: false
          description: 미지정 시 전체
          schema:
            $ref: "#/components/schemas/PotMemberRole"
        - name: status
          in: query
          required: false
          description: 방 상태 필터, 미지정 시 전체
          schema:
            $ref: "#/components/schemas/PotStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyPotHistoryPageResponse"

  /api/users/me/reports:
    get:
      tags:
        - Report
      summary: 내가 접수한 신고 내역 조회
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportPageResponse"

  /api/users/{userId}:
    get:
      tags:
        - User
      summary: 회원 공개 프로필 조회
      description: 동승자 확인용. 닉네임·대학교·평점만 공개 (실명·학번 등 개인정보 비공개)
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublicResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # =========================
  # WALLET API
  # =========================

  /api/wallet:
    get:
      tags:
        - Wallet
      summary: 내 지갑 잔액 조회
      description: 메인 화면 상시 표시용
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletResponse"

  /api/wallet/history:
    get:
      tags:
        - Wallet
      summary: 포인트 이용 내역 조회
      description: |
        POINT_HISTORY 최신순 (충전·예치·환불·택시비·수수료·방장 정산금·미수금 납부·잔액 소멸).
        정산 1건은 같은 시각에 여러 행(FARE_REFUND 예치 해제 → FARE_PAY → FEE, 방장은 HOST_PAYOUT 포함)으로 기록되므로 id 내림차순으로 정렬한다
      parameters:
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PointType"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointHistoryPageResponse"

  /api/wallet/debts:
    get:
      tags:
        - Wallet
      summary: 내 미수금 목록 조회 (3.3.0)
      description: |
        SETTLEMENT에서 debt_status가 UNPAID·OVERDUE인 행 (납부 기한 빠른 순). 메인 화면에 WalletResponse.debtAmount > 0이면 배너로 안내
      responses:
        "200":
          description: 성공 (없으면 빈 배열)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DebtResponse"

  /api/wallet/debts/{settlementId}/pay:
    post:
      tags:
        - Wallet
      summary: 미수금 납부 (3.3.0)
      description: |
        지갑 사용 가능 잔액(balance)으로 미수금을 납부한다. Body 없음. 락 순서: USERS(본인) → WALLET(본인) → SETTLEMENT 행
        - 납부액 = min(balance, debt_amount). balance가 0이면 409 INSUFFICIENT_BALANCE (detail: requiredAmount = debt_amount)
        - POINT_HISTORY DEBT_PAY(−납부액, pot_id = 해당 방), debt_amount − 납부액
        - debt_amount가 0이 되면 debt_status = PAID, debt_paid_at = now
        - 본인 정산 행이 아니면 404, 미수금이 없으면(NONE·PAID) 409 NO_DEBT
        - 기한이 지나도(OVERDUE) 납부 금액은 그대로이며 같은 방법으로 납부한다 (10배는 약관 문구만, 3.4.0)
      parameters:
        - name: settlementId
          in: path
          required: true
          description: 정산 번호 (SETTLEMENT.id, DebtResponse.settlementId)
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 납부 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DebtPayResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: NO_DEBT / INSUFFICIENT_BALANCE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # =========================
  /api/wallet/withdrawals:
    post:
      tags:
        - Wallet
      summary: 등록 계좌로 출금 (3.5.0)
      description: |
        지갑 사용 가능 잔액(balance)을 가입 시 등록한 본인 계좌로 보낸다. 락 순서: USERS(본인) → WALLET(본인)
        - 검증: 계좌 등록(아니면 409 ACCOUNT_NOT_REGISTERED) → amount ≥ 1,000(아니면 400 INVALID_INPUT) → amount ≤ balance(아니면 409 INSUFFICIENT_BALANCE)
          - 미수금이 있으면 이용 제한으로 409 UNPAID_DEBT_EXISTS. 정지 중이어도 출금 가능. 예치금(held_balance)은 출금 대상 아님
        - 1단계(트랜잭션 1): WITHDRAWAL 생성(status = REQUESTED, 계좌 스냅샷 복사), balance − amount, POINT_HISTORY WITHDRAW(−amount, withdrawal_id 연결) 커밋
        - 2단계(송금): transfer_provider = DUMMY는 실제 송금 없이 즉시 성공 → transfer_tid = `DUMMY-{UUID}`, status = COMPLETED, completed_at = now,
          PAYMENT 알림('N원이 OO은행 ****7890 계좌로 입금되었습니다')
          - 실패 시 status = FAILED, fail_reason, completed_at = now, balance + amount, POINT_HISTORY WITHDRAW_REFUND(+amount, 같은 withdrawal_id), 실패 알림
          - 시연에서 실패를 보이려면 설정값 `app.withdrawal.dummy-fail-amount`와 같은 금액으로 요청
        - 응답은 2단계 결과(COMPLETED 또는 FAILED)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalRequest"
      responses:
        "200":
          description: 처리 완료 (status로 성공·실패 확인)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: ACCOUNT_NOT_REGISTERED / INSUFFICIENT_BALANCE / UNPAID_DEBT_EXISTS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags:
        - Wallet
      summary: 내 출금 내역 조회 (3.5.0)
      description: 최신순 페이지. 계좌번호는 마스킹
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalPageResponse"

  # =========================
  # PAYMENT API
  # =========================

  /api/payments:
    post:
      tags:
        - Payment
      summary: 포인트 충전 요청
      description: |
        서버가 order_id를 발급하고 PAYMENT 행을 생성한다. 1회 충전 1,000 ~ 500,000원, 충전 후 잔액(balance + held_balance)이 1,000,000원을 넘으면 409.
        - 앱 충전은 PORTONE만 허용 (16일 회의). PENDING으로 생성 후 반환된 orderId로 앱에서 결제창 호출 → 결제 후 `/api/payments/confirm` 호출
        - pgProvider = DUMMY는 400 DUMMY_CHARGE_NOT_ALLOWED (3.3.0). 시연 충전은 운영자 웹의 지갑 잔액 조정(`PATCH /api/admin/users/{userId}/wallet`)으로 한다
        - 3.7.0: PORTONE 연동은 캡스톤 범위 외 — 이 API와 `/api/payments/confirm`은 명세만 유지(구현 선택). 시연 충전은 운영자 잔액 조정으로만 한다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentCreateRequest"
      responses:
        "200":
          description: PENDING 상태로 반환 (balanceAfter = null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "400":
          description: INVALID_INPUT / DUMMY_CHARGE_NOT_ALLOWED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: WALLET_LIMIT_EXCEEDED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                walletLimitExceeded:
                  $ref: "#/components/examples/WalletLimitExceeded"

    get:
      tags:
        - Payment
      summary: 내 충전 결제 내역 조회
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PaymentStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 성공 (최신순)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentPageResponse"

  /api/payments/confirm:
    post:
      tags:
        - Payment
      summary: 충전 결제 승인 (PORTONE 전용)
      description: |
        PG 결제 완료 후 호출. 서버가 PG사에 결제 금액을 재검증한 뒤 처리한다.
        - 성공: status = PAID, pg_tid·paid_at 저장, WALLET.balance 증가, POINT_HISTORY CHARGE(payment_id 연결), PAYMENT 알림
        - 미수금 자동 납부 (3.5.0): CHARGE 직후 같은 트랜잭션에서 미수금을 debt_due_at 빠른 순으로 DEBT_PAY. 응답 balanceAfter는 자동 납부 후 잔액
          - 잔액 상한(1,000,000원) 검사는 자동 납부 전 금액 기준
        - 충전 후 지갑 잔액이 상한(1,000,000원)을 넘으면 PG 결제를 취소하고 status = FAILED (WALLET_LIMIT_EXCEEDED)
        - 금액 불일치·PG 실패: status = FAILED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentConfirmRequest"
      responses:
        "200":
          description: 승인 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "400":
          description: PAYMENT_AMOUNT_MISMATCH / PAYMENT_FAILED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: PAYMENT_ALREADY_PROCESSED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # =========================
  # POT API
  # =========================

  /api/pots:
    get:
      tags:
        - Pot
      summary: 택시팟 목록 조회 (지도 마커 / 바텀 시트 공용)
      description: |
        기본값은 모집중(RECRUITING) 방만 조회.
        - 참여 마감(joinDeadline = 집결 기한)이 지난 RECRUITING 방도 숨기지 않는다 (16일 회의). 앱은 joinDeadline과 응답 헤더 `Date`(서버 시각)를 비교해
          마감 전이면 '참여', 마감 후면 '입장 요청' 버튼을 보여준다 (폰 시계 오차 대비, 최종 판정은 서버)
        - RECRUITING이면서 has_canceled = 1(참여자 이탈로 빈자리 발생)인 방은 정렬 조건과 관계없이 상단 노출, 응답 hasCanceled로 색상 구분
        - 내 성별로 참여할 수 없는 성별 제한 방은 자동 제외
        - lat·lng를 주면 반경(radius) 안의 방만 조회하고 distanceMeters를 채움 (지도 마커는 응답 좌표 사용)
        - 출발지·도착지 이름 검색, 출발 시각 범위, 방장 평점 필터·정렬 지원
      parameters:
        - name: lat
          in: query
          required: false
          description: 기준 위도 (lng와 함께 사용)
          schema:
            type: number
            format: double
          example: 37.5665
        - name: lng
          in: query
          required: false
          description: 기준 경도 (lat과 함께 사용)
          schema:
            type: number
            format: double
          example: 126.978
        - name: radius
          in: query
          required: false
          description: 검색 반경(m), lat·lng 지정 시에만 적용
          schema:
            type: integer
            default: 1000
        - name: departureName
          in: query
          required: false
          description: 출발지 명칭 검색 (부분 일치, 예 '회기역')
          schema:
            type: string
        - name: destinationName
          in: query
          required: false
          description: 도착지 명칭 검색 (부분 일치)
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: 출발 예정 시각 시작 범위
          schema:
            type: string
            format: date-time
            example: "2026-10-16T23:00:00+09:00"
        - name: to
          in: query
          required: false
          description: 출발 예정 시각 종료 범위
          schema:
            type: string
            format: date-time
            example: "2026-10-17T01:00:00+09:00"
        - name: genderOption
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/GenderOption"
        - name: minHostRating
          in: query
          required: false
          description: 방장 최소 평점 (1.00~10.00)
          schema:
            type: number
            format: double
            minimum: 1
            maximum: 10
        - name: sort
          in: query
          required: false
          description: DISTANCE는 lat·lng 지정 시에만 사용 가능
          schema:
            type: string
            enum:
              - DEPARTURE_TIME
              - DISTANCE
              - HOST_RATING
            default: DEPARTURE_TIME
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PotPageResponse"

    post:
      tags:
        - Pot
      summary: 택시팟 방 생성
      description: |
        하나의 트랜잭션으로 처리한다. 락 순서: USERS(본인) → WALLET(본인) (공통 규칙 '동시성 제어' 참고)
        1. TAXIPOT 생성 (status = RECRUITING, current_members = 1, arrival_deadline = departureTime − 5분)
        2. TAXIPOT_MEMBER에 방장 등록 (role = HOST)
        3. 방장 예치: WALLET.balance → held_balance, SETTLEMENT 생성(HELD, fee_amount NULL), POINT_HISTORY FARE_HOLD(−예치액) 1행
        - 공통 이용 조건(인증·정지·미수금·잔액) 검증
        - 출발 시각은 현재 + 15분 이후 ~ 현재 + 24시간 이내 (서버 설정값). 15분 미만이면 400 DEPARTURE_TIME_TOO_SOON (detail.minDepartureTime),
          24시간 초과면 400 DEPARTURE_TIME_TOO_FAR (detail.maxDepartureTime) (3.4.0)
        - 성별 제한 방(MALE/FEMALE)은 방장 성별과 일치해야 생성 가능
        - 이미 진행 중인 다른 방(핵심 정책 정의, 청구 접수 이후 방은 제외)에 참여 중이면 생성 불가
        - 출발지·도착지 명칭은 카카오맵 핀 위치의 장소명 그대로 전달
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PotCreateRequest"
      responses:
        "200":
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PotDetailResponse"
        "400":
          description: INVALID_INPUT (maxMembers가 3·4가 아님 등) / DEPARTURE_TIME_TOO_SOON (출발 15분 전보다 늦게 생성) / DEPARTURE_TIME_TOO_FAR (24시간 넘게 남은 출발 시각)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                departureTimeTooSoon:
                  $ref: "#/components/examples/DepartureTimeTooSoon"
                departureTimeTooFar:
                  $ref: "#/components/examples/DepartureTimeTooFar"
        "403":
          description: NOT_VERIFIED / SUSPENDED_USER / GENDER_RESTRICTED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                suspendedUser:
                  $ref: "#/components/examples/SuspendedUser"
                notVerified:
                  $ref: "#/components/examples/NotVerified"
        "409":
          description: INSUFFICIENT_BALANCE / ACTIVE_POT_EXISTS / UNPAID_DEBT_EXISTS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                insufficientBalance:
                  $ref: "#/components/examples/InsufficientBalance"
                activePotExists:
                  $ref: "#/components/examples/ActivePotExists"
                unpaidDebtExists:
                  $ref: "#/components/examples/UnpaidDebtExists"

  /api/pots/{potId}:
    get:
      tags:
        - Pot
      summary: 택시팟 상세 조회
      description: |
        방 정보와 참여자 목록(JOINED·BOARDED)을 함께 반환.
        - 입장 요청 대기자(REQUESTED)는 members에 넣지 않는다. 방장은 `GET /api/pots/{potId}/join-requests`로 조회
        - myMemberStatus로 요청자의 참여 상태(REQUESTED·REJECTED 포함)를 알 수 있다 (참여 이력 없으면 null)
        - 오픈채팅 링크는 참여자에게만 노출
        - 출발지·도착지 이름과 좌표로 앱에서 카카오 T·우버 딥링크를 생성
      parameters:
        - $ref: "#/components/parameters/PotId"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PotDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags:
        - Pot
      summary: 택시팟 정보 수정 (방장 전용)
      description: RECRUITING·CLOSED 상태에서 방 제목과 오픈채팅 링크만 수정 가능. 변경할 항목만 전달
      parameters:
        - $ref: "#/components/parameters/PotId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PotUpdateRequest"
      responses:
        "200":
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PotDetailResponse"
        "403":
          description: NOT_POT_HOST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: INVALID_POT_STATUS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags:
        - Pot
      summary: 택시팟 방 취소 (방장 전용)
      description: |
        RECRUITING·CLOSED 상태에서 출발 10분 전까지만 가능. Body 없음.
        - TAXIPOT status = CANCELED
        - 전 참여자 예치금 전액 환불 (SETTLEMENT → REFUNDED, POINT_HISTORY FARE_REFUND)
        - 입장 요청 대기자(REQUESTED) → CANCELED, canceled_at = now
        - 참여자 전원·요청자에게 POT 알림
      parameters:
        - $ref: "#/components/parameters/PotId"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "403":
          description: NOT_POT_HOST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: INVALID_POT_STATUS / CANCEL_TIME_EXPIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/pots/{potId}/start:
    post:
      tags:
        - Pot
      summary: 탑승 시작 (방장 전용)
      description: |
        방장이 택시 탑승 시 호출. RECRUITING·CLOSED 상태에서만 가능.
        - 방장 포함 남은 JOINED 참여자 전원이 도착 확인(arrived_at NOT NULL)해야 함 — 한 명이라도 미도착이면 출발 불가 (16일 회의)
          (집결 기한 후 미도착자는 스케줄러가 이미 퇴장 처리, 방장은 기다리지 않고 내보내기도 가능)
        - 탑승 인원이 2명 미만이면 시작 불가 (방장 혼자 남은 방은 출발 시각에 스케줄러가 자동 취소·환불)
        - TAXIPOT status = RUNNING, started_at = now(청구 기한 기준, 3.5.0), 참여자 status = BOARDED, 입장 요청 대기자(REQUESTED) → CANCELED + POT 알림
        - 이후 앱은 상세 응답 좌표로 외부 택시 앱 딥링크를 연다
      parameters:
        - $ref: "#/components/parameters/PotId"
      responses:
        "200":
          description: 탑승 시작 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PotDetailResponse"
        "403":
          description: NOT_POT_HOST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: INVALID_POT_STATUS / NOT_ALL_ARRIVED / NOT_ENOUGH_MEMBERS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # =========================
  # POT MEMBER API
  # =========================

  /api/pots/{potId}/members:
    post:
      tags:
        - PotMember
      summary: 택시팟 참여
      description: |
        하나의 트랜잭션으로 처리. 락 순서: USERS(본인) → WALLET(본인) → TAXIPOT(대상 방), 모두 `SELECT ... FOR UPDATE`
        - USERS 락으로 같은 회원의 서로 다른 방 동시 참여를 막고, TAXIPOT 락으로 동시 신청 정원 초과를 막는다
        - 검증: 공통 이용 조건, 방 상태 RECRUITING, now < 참여 마감(arrival_deadline), current_members < max_members, 성별 제한 일치, 진행 중인 다른 방 없음, 잔액 ≥ 예치액
          - 참여 마감이 지났으면 409 JOIN_DEADLINE_PASSED (detail.joinDeadline) → 앱은 입장 요청(`POST /api/pots/{potId}/join-requests`)으로 안내
        - 처리: TAXIPOT_MEMBER 등록(GUEST), current_members + 1, SETTLEMENT 생성(HELD), WALLET 예치, POINT_HISTORY FARE_HOLD(−예치액) 1행
        - 취소 이력이 있으면 INSERT 대신 기존 TAXIPOT_MEMBER·SETTLEMENT 행을 UPDATE — UNIQUE(pot_id, member_id)
          - TAXIPOT_MEMBER: status = JOINED, joined_at = now, arrived_at·canceled_at = NULL, preferred_seat 갱신
          - SETTLEMENT: status = HELD, held_amount = 새 예치액, fare_share·fee_amount·diff_amount·settled_at = NULL, uncovered_amount = 0, debt_status = NONE
        - 내보내진(KICKED)·노쇼(NO_SHOW)·입장 거절(REJECTED) 처리된 방에는 재참여 불가
        - 인원이 다 차면 status = CLOSED, 참여자 전원에게 POT 알림
      parameters:
        - $ref: "#/components/parameters/PotId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRequest"
      responses:
        "200":
          description: 참여 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinResponse"
        "403":
          description: NOT_VERIFIED / SUSPENDED_USER / GENDER_RESTRICTED / KICKED_FROM_POT(KICKED·NO_SHOW) / JOIN_REQUEST_REJECTED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                suspendedUser:
                  $ref: "#/components/examples/SuspendedUser"
                genderRestricted:
                  $ref: "#/components/examples/GenderRestricted"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: POT_FULL / INVALID_POT_STATUS / ALREADY_JOINED / ACTIVE_POT_EXISTS / INSUFFICIENT_BALANCE / JOIN_DEADLINE_PASSED / UNPAID_DEBT_EXISTS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                insufficientBalance:
                  $ref: "#/components/examples/InsufficientBalance"
                activePotExists:
                  $ref: "#/components/examples/ActivePotExists"
                potFull:
                  $ref: "#/components/examples/PotFull"
                joinDeadlinePassed:
                  $ref: "#/components/examples/JoinDeadlinePassed"

  /api/pots/{potId}/members/me:
    delete:
      tags:
        - PotMember
      summary: 택시팟 참여 취소 (동승자 전용)
      description: |
        방장은 취소 대신 방 취소(DELETE /api/pots/{potId}) 사용. Body 없음.
        - 출발 10분 전부터 취소 불가 (서버 검증)
        - TAXIPOT_MEMBER status = CANCELED, canceled_at = now
        - current_members − 1, has_canceled = 1, CLOSED였다면 RECRUITING으로 변경
        - 예치금 전액 환불 (SETTLEMENT → REFUNDED, POINT_HISTORY FARE_REFUND). 수수료는 기록·차감하지 않음
        - 입장 요청 대기 중(REQUESTED)인 사람은 이 API가 아니라 `DELETE /api/pots/{potId}/join-requests/me`로 철회
        - 방장에게 POT 알림
      parameters:
        - $ref: "#/components/parameters/PotId"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "403":
          description: HOST_CANNOT_LEAVE / NOT_POT_MEMBER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: CANCEL_TIME_EXPIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                cancelTimeExpired:
                  $ref: "#/components/examples/CancelTimeExpired"

  /api/pots/{potId}/members/me/seat:
    patch:
      tags:
        - PotMember
      summary: 희망 좌석 변경
      description: RECRUITING·CLOSED 상태에서만 변경 가능
      parameters:
        - $ref: "#/components/parameters/PotId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeatChangeRequest"
      responses:
        "200":
          description: 변경 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PotMemberResponse"
        "403":
          description: NOT_POT_MEMBER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: INVALID_POT_STATUS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/pots/{potId}/members/me/arrival:
    post:
      tags:
        - PotMember
      summary: 도착 확인 (GPS 검증)
      description: |
        현재 GPS 좌표와 출발지 좌표의 거리(하버사인 공식)가 도착 인정 반경(서버 설정값, 50m — 16일 회의) 이내일 때만 arrived_at = now 기록.
        앱은 반경 안에서만 버튼을 활성화하되 최종 판정은 서버가 한다.
        - 집결 기한 이후에는 호출 불가 (자동 퇴장 대상)
        - 도착 확인한 참여자는 방장이 내보낼 수 없음
        - 전원 도착 시 참여자 전원에게 POT 알림, STOMP `/topic/pots/{potId}`로 `POT_UPDATED` 전송
        - 시연 주의: 50m는 실내·고층 건물 옆에서 GPS 오차보다 작을 수 있음. 시연은 실외에서 하거나 Android 개발자 옵션의 '모의 위치 앱'으로 좌표를 고정하고,
          앱은 위치 요청에 `Priority.PRIORITY_HIGH_ACCURACY`를 사용
      parameters:
        - $ref: "#/components/parameters/PotId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArrivalRequest"
      responses:
        "200":
          description: 도착 확인 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArrivalResponse"
        "400":
          description: OUT_OF_ARRIVAL_RANGE (detail에 현재 거리·인정 반경)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                outOfArrivalRange:
                  $ref: "#/components/examples/OutOfArrivalRange"
        "403":
          description: NOT_POT_MEMBER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: ARRIVAL_DEADLINE_PASSED / ALREADY_ARRIVED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/pots/{potId}/members/{userId}/kick:
    post:
      tags:
        - PotMember
      summary: 미도착자 내보내기 (방장 전용)
      description: |
        RECRUITING·CLOSED 상태에서 도착 확인(arrived_at)이 없는 동승자만 내보낼 수 있음. Body 없음.
        - 공통: canceled_at = now(퇴장 처리 시각, 16일 회의), current_members − 1, has_canceled = 1, CLOSED였다면 RECRUITING으로 변경,
          예치금 전액 환불 (SETTLEMENT → REFUNDED, fare_share NULL, POINT_HISTORY FARE_REFUND), 대상자에게 KICKED 알림, 같은 방 재참여 불가
        - 집결 기한 전: TAXIPOT_MEMBER status = KICKED (노쇼 아님, 정지·집계 없음)
        - 집결 기한 후: TAXIPOT_MEMBER status = NO_SHOW, no_show_count + 1, 15분 이용 정지 (now + 15분, 기존 정지가 더 길면 유지)
        - 락 순서: 대상 회원 USERS → WALLET → TAXIPOT
        - 집결 기한까지 미도착한 동승자는 이 API 없이도 스케줄러가 자동 퇴장 처리
      parameters:
        - $ref: "#/components/parameters/PotId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "403":
          description: NOT_POT_HOST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: MEMBER_ALREADY_ARRIVED / INVALID_POT_STATUS / NOT_POT_MEMBER(대상이 참여 중이 아님·본인)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/pots/{potId}/join-requests:
    post:
      tags:
        - PotMember
      summary: 입장 요청 (참여 마감 후, 3.3.0)
      description: |
        참여 마감(집결 기한, 출발 5분 전) 이후 출발지 근처에서 급하게 합류하려는 사람이 방장에게 입장을 요청한다 (16일 회의).
        락 순서: USERS(본인) → WALLET(본인) → TAXIPOT(대상 방)
        - 가능 조건: 방 상태 RECRUITING(빈자리 있음), now ≥ 참여 마감, 탑승 시작 전
          - 마감 전이면 409 JOIN_REQUEST_NOT_AVAILABLE (일반 참여 사용)
        - 위치: 요청 좌표와 출발지 거리가 50m 이내 (아니면 400 OUT_OF_ARRIVAL_RANGE)
        - 검증: 일반 참여와 같은 공통 이용 조건(인증·정지·미수금·성별·진행 중인 다른 방·잔액 ≥ 예치액)
          - KICKED·NO_SHOW면 403 KICKED_FROM_POT, REJECTED면 403 JOIN_REQUEST_REJECTED, 이미 REQUESTED면 409 ALREADY_REQUESTED, JOINED면 409 ALREADY_JOINED
        - 처리: TAXIPOT_MEMBER status = REQUESTED, joined_at = now, preferred_seat (CANCELED 행이 있으면 UPDATE), 예치는 아직 하지 않음
        - 방장에게 POT 알림 + STOMP `POT_UPDATED`
      parameters:
        - $ref: "#/components/parameters/PotId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRequestCreateRequest"
      responses:
        "200":
          description: 요청 성공 (방장 수락 대기)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinRequestResponse"
        "400":
          description: OUT_OF_ARRIVAL_RANGE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                outOfArrivalRange:
                  $ref: "#/components/examples/OutOfArrivalRange"
        "403":
          description: NOT_VERIFIED / SUSPENDED_USER / GENDER_RESTRICTED / KICKED_FROM_POT / JOIN_REQUEST_REJECTED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: JOIN_REQUEST_NOT_AVAILABLE / INVALID_POT_STATUS / POT_FULL / ALREADY_REQUESTED / ALREADY_JOINED / ACTIVE_POT_EXISTS / INSUFFICIENT_BALANCE / UNPAID_DEBT_EXISTS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      tags:
        - PotMember
      summary: 입장 요청 대기 목록 조회 (방장 전용, 3.3.0)
      description: status = REQUESTED인 요청자 목록 (요청 시각 순)
      parameters:
        - $ref: "#/components/parameters/PotId"
      responses:
        "200":
          description: 성공 (없으면 빈 배열)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JoinRequestResponse"
        "403":
          description: NOT_POT_HOST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/pots/{potId}/join-requests/me:
    delete:
      tags:
        - PotMember
      summary: 입장 요청 철회 (3.3.0)
      description: 내 REQUESTED 요청을 CANCELED로 바꾸고 canceled_at = now. Body 없음. 예치 전이라 환불 없음. 방장에게 STOMP `POT_UPDATED`
      parameters:
        - $ref: "#/components/parameters/PotId"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "409":
          description: JOIN_REQUEST_NOT_FOUND (대기 중인 요청 없음)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/pots/{potId}/join-requests/{userId}/accept:
    post:
      tags:
        - PotMember
      summary: 입장 요청 수락 (방장 전용, 3.3.0)
      description: |
        하나의 트랜잭션. 락 순서: 요청자 USERS → 요청자 WALLET → TAXIPOT. Body 없음.
        - 재검증(요청 이후 바뀌었을 수 있음): 요청 status = REQUESTED, 방 RECRUITING·빈자리, 요청자 정지·미수금 없음, 진행 중인 다른 방 없음, 잔액 ≥ 예치액
          - 요청자 잔액 부족 등으로 수락할 수 없으면 해당 에러 반환, 요청은 REQUESTED로 남는다 (방장은 거절 가능)
        - 처리: status = JOINED, arrived_at = now(요청 시 반경 50m 확인 → 도착 확인으로 간주, 수락 즉시 노쇼 처리 방지), current_members + 1,
          SETTLEMENT 생성(HELD, 있으면 UPDATE), WALLET 예치, POINT_HISTORY FARE_HOLD(−예치액)
        - 인원이 다 차면 status = CLOSED, 남은 REQUESTED는 CANCELED + POT 알림(자리 마감)
        - 요청자에게 POT 알림(수락), 참여자에게 STOMP `POT_UPDATED`
      parameters:
        - $ref: "#/components/parameters/PotId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 수락 성공 (요청자의 참여 결과)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinResponse"
        "403":
          description: NOT_POT_HOST / SUSPENDED_USER(요청자 정지)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: JOIN_REQUEST_NOT_FOUND / INVALID_POT_STATUS / POT_FULL / ACTIVE_POT_EXISTS / INSUFFICIENT_BALANCE(요청자 잔액) / UNPAID_DEBT_EXISTS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/pots/{potId}/join-requests/{userId}/reject:
    post:
      tags:
        - PotMember
      summary: 입장 요청 거절 (방장 전용, 3.3.0)
      description: |
        status = REJECTED, canceled_at = now. Body 없음. 같은 방에 다시 요청·참여 불가. 요청자에게 POT 알림.
        has_canceled는 바꾸지 않는다 (참여자 이탈이 아님)
      parameters:
        - $ref: "#/components/parameters/PotId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "403":
          description: NOT_POT_HOST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: JOIN_REQUEST_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # =========================
  # SETTLEMENT API
  # =========================

  /api/pots/{potId}/fare-claim:
    post:
      tags:
        - Settlement
      summary: 실요금 청구 (방장 전용, 3.5.0)
      description: |
        하차 후 방장이 결제내역(영수증) 사진과 실제 요금으로 정산을 청구한다. 정산(돈 이동)은 운영자가 승인할 때 실행된다 (3.5.0, 기존 즉시 정산 API 대체).
        `multipart/form-data` — 파트 `actualFare`(텍스트, 정수) + `receiptImage`(jpg/png 파일)
        - Kotlin: `@Multipart` + `@Part("actualFare") actualFare: RequestBody`(`"19300".toRequestBody("text/plain".toMediaType())`) + `@Part receiptImage: MultipartBody.Part`
        - Spring: `@RequestParam("actualFare") Integer actualFare, @RequestPart("receiptImage") MultipartFile receiptImage`
        - 사진이 없거나 비어 있으면 400 RECEIPT_REQUIRED, 형식 오류는 400 INVALID_INPUT
        - 가능 조건: TAXIPOT status = RUNNING이고 fare_claim_status가 NONE·REJECTED·OVERDUE
          - PENDING이면 409 FARE_CLAIM_IN_REVIEW, APPROVED면 409 ALREADY_SETTLED
        - 처리: 영수증 파일 저장(`{app.upload-dir}/receipts/{potId}/{UUID}`, 재청구면 이전 파일 삭제), actual_fare·receipt_img_path 저장,
          fare_claim_status = PENDING, fare_claimed_at = now, fare_reject_reason = NULL
        - 운영자(role = ADMIN)에게 SYSTEM 알림('정산 청구 확인 요청'), 탑승자에게 STOMP `POT_UPDATED`
        - 청구 접수 후 탑승자는 '진행 중인 다른 방'에서 제외되어 새 방을 이용할 수 있다
      parameters:
        - $ref: "#/components/parameters/PotId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FareClaimRequest"
      responses:
        "200":
          description: 청구 접수 (운영자 확인 대기)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FareClaimResponse"
        "400":
          description: INVALID_INPUT(금액 범위·이미지 형식) / RECEIPT_REQUIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: NOT_POT_HOST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: INVALID_POT_STATUS / FARE_CLAIM_IN_REVIEW / ALREADY_SETTLED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/pots/{potId}/settlement:
    get:
      tags:
        - Settlement
      summary: 택시팟 정산 내역 조회
      description: 해당 방 참여자만 조회 가능. 참여자별 예치액·분담금·수수료·차액·미수금 + 방장 정산금·영수증 URL 반환. 운영자 승인 전에는 정산 값이 null (3.5.0)
      parameters:
        - $ref: "#/components/parameters/PotId"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PotSettlementResponse"
        "403":
          description: NOT_POT_MEMBER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/pots/{potId}/receipt:
    get:
      tags:
        - Settlement
      summary: 결제내역(영수증) 사진 조회 (3.3.0)
      description: |
        해당 방 탑승자(BOARDED)만 조회 가능 (운영자는 `/api/admin/pots/{potId}/receipt`). 이미지 바이너리 반환, Bearer 토큰 필요
        (공통 규칙 '이미지 조회 API' 참고). 영수증이 없거나 보관 기간(정산 승인 후 90일)이 지나 파기됐으면 404 (3.6.0)
      parameters:
        - $ref: "#/components/parameters/PotId"
      responses:
        "200":
          description: 이미지
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "403":
          description: NOT_POT_MEMBER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # =========================
  # RATING API
  # =========================

  /api/pots/{potId}/ratings/targets:
    get:
      tags:
        - Rating
      summary: 평가 대상 동승자 목록 조회
      description: COMPLETED 방에서 나를 제외한 탑승자(BOARDED) 목록과 평가 제출 여부 (자동 기본 평가가 들어간 대상도 isRated = true)
      parameters:
        - $ref: "#/components/parameters/PotId"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RatingTargetResponse"
        "403":
          description: NOT_POT_MEMBER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/pots/{potId}/ratings:
    post:
      tags:
        - Rating
      summary: 동승자 평가 제출 (여러 명 한 번에)
      description: |
        평가 화면 한 번 제출로 동승자 여러 명을 함께 평가. 평가자·피평가자 모두 해당 방 BOARDED여야 하고 본인 평가 불가.
        - UNIQUE(pot_id, reviewer_id, reviewee_id) — 대상자별 1회
        - avg_score는 DB 생성 컬럼으로 자동 계산
        - 피평가자 rating_avg: avg_score ≥ 4 → +0.2 / 3 ≤ avg_score < 4 → 유지 / avg_score < 3 → −0.2 (1.00~10.00 범위 고정)
        - avg_score < 3(별로였어요)이면 badReason 필수
        - 요청 안의 항목은 하나의 트랜잭션 (하나라도 실패하면 전체 롤백)
        - 평가 기간: 정산 완료(settled_at = 운영자 청구 승인 시각, 3.5.0) 후 24시간까지. 지나면 409 RATING_PERIOD_EXPIRED (그 뒤 스케줄러가 is_default = 1 기본 평가를 넣음, 3.3.0)
        - 회원 제출 행은 is_default = 0. 스케줄러와 동시에 들어가 UNIQUE 위반이 나면 409 ALREADY_RATED로 변환
      parameters:
        - $ref: "#/components/parameters/PotId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatingCreateRequest"
      responses:
        "200":
          description: 평가 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RatingResponse"
        "400":
          description: INVALID_INPUT(별점 범위) / BAD_REASON_REQUIRED / SELF_RATING_NOT_ALLOWED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: NOT_POT_MEMBER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: INVALID_POT_STATUS(정산 미완료) / ALREADY_RATED / RATING_PERIOD_EXPIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # =========================
  # REPORT API
  # =========================

  /api/reports:
    post:
      tags:
        - Report
      summary: 신고 접수
      description: |
        - 신고 자격 (16일 회의, 서버 검증)
          - ① 신고자·피신고자 모두 그 방 BOARDED (끝까지 함께 탑승) — 모든 신고 유형
          - ② 피신고자가 그 방 NO_SHOW이고 신고자가 끝까지 남은 참여자(JOINED·BOARDED) — type = NO_SHOW만 (방장 미도착으로 자동 해산된 방의 동승자 포함)
          - 그 외(중간 취소 CANCELED, KICKED, 본인 NO_SHOW, REQUESTED·REJECTED, 참여 이력 없음)는 403 REPORT_NOT_ELIGIBLE
        - 본인 신고 불가, 같은 방·같은 대상 중복 신고 불가 (UNIQUE(pot_id, reporter_id, reported_id))
        - 운영자 승인(APPROVED) 시에만 report_count 증가
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportCreateRequest"
      responses:
        "200":
          description: 접수 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "400":
          description: SELF_REPORT_NOT_ALLOWED / INVALID_INPUT(②인데 type이 NO_SHOW가 아님)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: REPORT_NOT_ELIGIBLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: DUPLICATE_REPORT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # =========================
  # CHAT API
  # =========================

  /api/pots/{potId}/messages:
    get:
      tags:
        - Chat
      summary: 채팅 메시지 조회 (이전 메시지, 무한 스크롤)
      description: |
        커서 기반 페이징 (최신순). 방 참여자(JOINED·BOARDED)만 조회 가능, 이용 정지 중에도 조회 가능.
        실시간 수신은 STOMP `/topic/pots/{potId}` 구독 후 `CHAT_MESSAGE` 메시지. 자체 채팅 대신 오픈채팅(open_chat_url)으로 대체 가능.
      parameters:
        - $ref: "#/components/parameters/PotId"
        - name: cursor
          in: query
          required: false
          description: 이전 응답의 nextCursor (이 메시지 id보다 오래된 메시지 조회), 미지정 시 최신부터
          schema:
            type: integer
            format: int64
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessagePageResponse"
        "403":
          description: NOT_POT_MEMBER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags:
        - Chat
      summary: 채팅 메시지·퀵블록 전송
      description: |
        CHAT_MESSAGE 저장 후 STOMP `/topic/pots/{potId}`로 브로드캐스트.
        - msgType = QUICK이면 `/api/quick-blocks`에 정의된 문구만 허용
        - 이용 정지 중에도 전송 가능, 방 상태 COMPLETED·CANCELED이면 전송 불가
      parameters:
        - $ref: "#/components/parameters/PotId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageRequest"
      responses:
        "200":
          description: 전송 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessageResponse"
        "400":
          description: INVALID_QUICK_MESSAGE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: NOT_POT_MEMBER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: INVALID_POT_STATUS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/quick-blocks:
    get:
      tags:
        - Chat
      summary: 퀵블록 문구 목록 조회
      description: 서버 상수로 관리하는 원터치 문구 ('1분 늦어요' ~ '5분 늦어요', '도착했어요' 등). 앱과 서버 검증 목록을 한 곳에서 관리
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuickBlockResponse"

  # =========================
  # NOTIFICATION API
  # =========================

  /api/notifications:
    get:
      tags:
        - Notification
      summary: 내 알림 목록 조회
      parameters:
        - name: unreadOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 성공 (최신순)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPageResponse"

  /api/notifications/unread-count:
    get:
      tags:
        - Notification
      summary: 안 읽은 알림 개수 조회
      description: 메인 화면 알림 배지용
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCountResponse"

  /api/notifications/{notificationId}/read:
    patch:
      tags:
        - Notification
      summary: 알림 읽음 처리
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
