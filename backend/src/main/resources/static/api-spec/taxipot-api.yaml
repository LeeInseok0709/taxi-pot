          - 정지 규칙 통일 (3.3.0): 이미 정지 중이면 기존 정지와 비교해 더 긴 쪽 유지 (예: 15분 노쇼 정지 중 3일 정지 → 3일, 영구 정지 중 → 영구 유지)
